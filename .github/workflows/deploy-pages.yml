name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
      - 'docs-src/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'requirements-docs.txt'
      # Snippet sources — the manual embeds sections of these verbatim.
      - 'README.md'
      - 'ADD_DATASET_TODO.md'
      - 'ECGBench_architecture/ARCHITECTURE.md'
    # No tag trigger. The github-pages environment restricts deployments to the
    # default branch by default, so a tag-ref run is rejected at the "waiting"
    # stage with "not allowed to deploy to github-pages due to environment
    # protection rules" — the build never even starts.
    #
    # Consequence: the version badge shows the newest tag reachable when the site
    # was last built, so a release cut without a docs change would leave it one
    # behind (issue #60). Closed by publish-pypi.yml, which runs on v* tags and
    # dispatches this workflow on main — see refresh-pages-version there. Keep
    # the workflow_dispatch trigger below: that dispatch is what uses it.
    #
    # Alternative, if that job is ever dropped: Settings -> Environments ->
    # github-pages -> Deployment branches and tags: add a tag rule "v*", then
    # restore a tags: trigger here.
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag to stamp in _version.json (leave blank to infer from git)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # `git describe` below needs tags, which depth-1 omits

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Build the manual with MkDocs into _site/docs/
        # Second generator (issue #78). Jekyll renders the dataset catalogue
        # into _site/; MkDocs renders docs-src/ into _site/docs/. The catalogue
        # keeps the site root and none of its output is touched — /docs/ is a
        # free path, the datasets collection lives at /datasets/.
        #
        # jekyll-build-pages runs in a container and leaves _site/ owned by
        # root, so reclaim it before writing into it. This repeats the chown in
        # the next step deliberately, so neither step depends on the other's
        # position.
        #
        # --strict turns a broken internal link into a failed build instead of a
        # deployed one. Must run from the repository root: pymdownx.snippets
        # resolves README.md and ARCHITECTURE.md relative to the working dir.
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          pip install -q -r requirements-docs.txt
          mkdocs build --strict -d _site/docs

      - name: Write _version.json into built site
        # index.html fetches this at runtime and keeps the version badge hidden
        # until it loads, so without this step the badge never appears on Pages.
        # Jekyll excludes _*-prefixed files, hence writing it after the build.
        # actions/jekyll-build-pages@v1 runs in a container and produces _site/
        # as root, so reclaim ownership first.
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site

          # Three sources, most trustworthy first.
          TAG="$INPUT_VERSION_TAG"
          if [ -z "$TAG" ]; then
            # Highest semver tag reachable from HEAD. NOT `git describe`: when
            # two tags share a commit (v0.48.0 and v0.50.0 both sat on e1a4f67)
            # describe returns whichever it likes — it picked the older one, so
            # the badge disagreed with PyPI even though both tags were present.
            TAG="$(git tag --sort=-v:refname --merged HEAD 2>/dev/null | grep -m1 '^v[0-9]' || echo '')"
          fi
          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          fi
          echo "Stamping tag: ${TAG:-<none>}"

          cat > _site/_version.json <<EOF
          {
            "tag": "${TAG}",
            "sha": "${GITHUB_SHA:0:12}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "Wrote _site/_version.json:"
          cat _site/_version.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
