name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # `git describe` below needs tags, which depth-1 omits

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Write _version.json into built site
        # index.html fetches this at runtime and keeps the version badge hidden
        # until it loads, so without this step the badge never appears on Pages.
        # Jekyll excludes _*-prefixed files, hence writing it after the build.
        # actions/jekyll-build-pages@v1 runs in a container and produces _site/
        # as root, so reclaim ownership first.
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site

          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            # Not a tag push (e.g. a docs/** change): show the latest release
            # reachable from HEAD rather than "dev".
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          fi

          cat > _site/_version.json <<EOF
          {
            "tag": "${TAG}",
            "sha": "${GITHUB_SHA:0:12}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "Wrote _site/_version.json:"
          cat _site/_version.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
