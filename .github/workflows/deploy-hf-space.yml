name: Deploy to HuggingFace Space

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-hf-space.yml'
      - 'docs-src/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'requirements-docs.txt'
      # Snippet sources — the manual embeds sections of these verbatim.
      - 'README.md'
      - 'ADD_DATASET_TODO.md'
      - 'ECGBench_architecture/ARCHITECTURE.md'
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # `git describe` below needs tags, which depth-1 omits

      - name: Validate HF_TOKEN secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_TOKEN secret is not set. Go to Settings -> Secrets -> Actions."
            exit 1
          fi
          echo "HF_TOKEN is set (length: ${#HF_TOKEN})"

      - name: Install huggingface_hub
        run: pip install -q "huggingface_hub>=0.23"

      - name: Override the site prefix for HF Space
        # GitHub Pages serves under /ECGBench/, but HF Spaces serve at the root
        # path, so both generators need their prefix rewritten.
        #
        # Jekyll: baseurl "" .
        #
        # MkDocs: it does NOT emit prefix-relative links when site_url is set —
        # it bakes site_url's *path* into every asset and nav href, so the Pages
        # value would emit /ECGBench/docs/assets/... and 404 on every stylesheet
        # here. Only the path component of the replacement matters; the host is
        # there so the canonical tags and sitemap.xml point somewhere real.
        run: |
          sed -i 's|^baseurl:.*|baseurl: ""|' docs/_config.yml
          sed -i 's|^site_url:.*|site_url: https://vlbthambawita-ecgbench.static.hf.space/docs/|' mkdocs.yml
          echo "Patched docs/_config.yml:"
          cat docs/_config.yml
          echo "Patched site_url:"
          grep '^site_url:' mkdocs.yml

      - name: Build with Jekyll
        # HF Spaces with sdk: static do not run Jekyll, so we must render
        # the Liquid templates here and upload the built _site/ instead of docs/.
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Build the manual with MkDocs into _site/docs/
        # Second generator (issue #78). Jekyll renders the dataset catalogue
        # into _site/; MkDocs renders docs-src/ into _site/docs/. The catalogue
        # keeps the site root and none of its output is touched — /docs/ is a
        # free path, the datasets collection lives at /datasets/.
        #
        # jekyll-build-pages runs in a container and leaves _site/ owned by
        # root, so reclaim it before writing into it. This repeats the chown in
        # the next step deliberately, so neither step depends on the other's
        # position.
        #
        # --strict turns a broken internal link into a failed build instead of a
        # deployed one. Must run from the repository root: pymdownx.snippets
        # resolves README.md and ARCHITECTURE.md relative to the working dir.
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          pip install -q -r requirements-docs.txt
          mkdocs build --strict -d _site/docs

      - name: Write _version.json into built site
        # Jekyll excludes _*-prefixed files by default, so write the
        # version stamp directly into the built output after the build.
        # actions/jekyll-build-pages@v1 runs in a container and produces
        # _site/ as root, so reclaim ownership before writing into it.
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site

          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == refs/* ]]; then
            # Not a tag push: show the latest release reachable from HEAD rather
            # than "dev", so a docs-only change does not blank the version badge.
            # Highest semver reachable, not `git describe` — describe picks
            # arbitrarily when two tags share a commit and can report the older
            # one (v0.48.0 vs v0.50.0 on e1a4f67).
            TAG="$(git tag --sort=-v:refname --merged HEAD 2>/dev/null | grep -m1 '^v[0-9]' || echo '')"
          fi
          SHA="${GITHUB_SHA:0:12}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > _site/_version.json <<EOF
          {
            "tag": "${TAG}",
            "sha": "${SHA}",
            "date": "${DATE}"
          }
          EOF
          echo "Wrote _site/_version.json:"
          cat _site/_version.json

      - name: Deploy _site/ to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PYEOF'
          import os, shutil
          from pathlib import Path
          from huggingface_hub import HfApi

          HF_SPACE = "vlbthambawita/ECGBench"
          api = HfApi(token=os.environ["HF_TOKEN"])
          sha = os.environ.get("GITHUB_SHA", "unknown")[:12]

          # Ensure the Space repo exists
          api.create_repo(
              repo_id=HF_SPACE,
              repo_type="space",
              space_sdk="static",
              exist_ok=True,
          )

          # Stage: copy the Jekyll-built _site/ then write HF Space README
          staging = Path("_hf_staging")
          if staging.exists():
              shutil.rmtree(staging)
          shutil.copytree("_site", staging)
          (staging / "README.md").write_text(
              "---\n"
              "title: ECGBench\n"
              "emoji: \"\U0001FAC0\"\n"
              "colorFrom: blue\n"
              "colorTo: purple\n"
              "sdk: static\n"
              "pinned: false\n"
              "license: mit\n"
              "short_description: Reproducible ECG benchmark datasets\n"
              "---\n"
          )

          print(f"Uploading to https://huggingface.co/spaces/{HF_SPACE} ...")
          api.upload_folder(
              folder_path=str(staging),
              repo_id=HF_SPACE,
              repo_type="space",
              commit_message=f"Deploy sha:{sha}",
              delete_patterns=["*"],
          )
          print(f"Successfully deployed to https://huggingface.co/spaces/{HF_SPACE}")
          PYEOF
