# ECGBench Config: SaMi-Trop (Chagas cardiomyopathy cohort)
# =========================================================
# 1,631 twelve-lead ECGs, one per patient, from an NIH-funded prospective cohort
# of patients with chronic Chagas cardiomyopathy in Minas Gerais, Brazil.
# https://doi.org/10.5281/zenodo.4905618
#
# THE CSV IS JOINED TO THE WAVEFORMS BY ROW POSITION, AND NOTHING ELSE COULD BE.
# exams.hdf5 holds a single (1631, 4096, 12) `tracings` array and — unlike its
# sibling CODE-15% — no `exam_id` dataset, so there is no key to join on. That
# is exactly the situation in which CODE-15% turned out NOT to be in file order,
# so the alignment was tested rather than assumed:
#
#   QRS amplitude is larger in men. Splitting the precordial peak-to-peak by
#   exams.csv's own `is_male` in row order gives a Welch t of 4.98; across 2,000
#   random permutations of the same rows the largest |t| was 3.44. The aligned
#   ordering beats every permutation, so the i-th CSV row is the i-th tracing.
#
# SamiTropSplitter re-checks the row count on every run and refuses to build
# paths if it is not 1,631, because a positional join against a file of the
# wrong length produces 1,631 confidently mislabelled records rather than an
# error. See ecgbench/labels/sami_trop.py.
#
# LEAD ORDER IS STANDARD — verified, not assumed. The two sibling TNMG releases
# disagree with each other (CODE-15% is standard, CODE-test puts aVR last), so
# channels 2-5 were checked against II-I, -(I+II)/2, I-II/2 and II-I/2 over 400
# records: each matched its expected combination to a median relative error
# under 0.3%, while every other assignment was off by more than 33%.
#
# CHECKSUMS. Both published files match Zenodo exactly — exams.csv
# 6c9007a0427f7c3d9e1b6fb091231a67 and exams.zip
# a7b65f115b0222ad2ecbc6a422496fdd. exams.hdf5 has no published checksum of its
# own; it ships inside exams.zip, which does.

name: "SaMi-Trop (Chagas Cardiomyopathy Cohort)"
slug: "sami_trop"
version: "1.0.0"
url: "https://doi.org/10.5281/zenodo.4905618"
# Zenodo serves exams.csv plus a 265 MB exams.zip, and the splitter generates
# metadata_csv anyway, so this must stay null. Pass --data-path.
download_url: null
license: "CC BY 4.0"
description: >
  1,631 twelve-lead ECGs — the first exam of each of 1,631 patients — from
  SaMi-Trop, an NIH-funded prospective cohort of patients with chronic Chagas
  cardiomyopathy recruited in Minas Gerais, Brazil, and followed for mortality.
  Recordings are 4,096 samples at 400 Hz (10.24 s), zero-padded from
  acquisitions of 7-10 s. The release ships no diagnostic label vocabulary: what
  it carries instead is age, sex, a single `normal_ecg` flag, a neural-network
  age estimate, and — the reason the dataset exists — complete mortality
  follow-up, with 104 of the 1,631 patients dead within a median 2.07 years.
  Every patient contributes exactly one recording, so there is no patient
  grouping to do and no within-dataset leakage to avoid.
citation: >
  Lima, E.M., Ribeiro, A.H., Paixão, G.M.M., Ribeiro, M.H., Filho, M.M.P.,
  Gomes, P.R., Oliveira, D.M., Sabino, E.C., Ribeiro, A.L.P., Schön, T.B.,
  Ribeiro, A.H. Deep neural network estimated electrocardiographic-age as a
  mortality predictor. medRxiv (2021).
doi: "10.1101/2021.02.19.21251232"

creators:
  - type: Organization
    name: "Universidade Federal de Minas Gerais"
  - type: Organization
    name: "Uppsala University"
  - type: Organization
    name: "University of São Paulo"

# --- Signal Properties ---
signal_format: "hdf5"
# float64 arrays already in millivolts: the median per-record peak is 4.3 mV and
# the median precordial peak-to-peak 1.7 mV. No scaling. (Stored as float64
# rather than CODE-15%'s float32 — twice the bytes for the same information.)
signal_unit_scale: 1.0
leads: 12
# Standard order, verified from the arrays — see the header note above.
lead_names: ["I", "II", "III", "aVR", "aVL", "aVF", "V1", "V2", "V3", "V4", "V5", "V6"]
# 4,096 samples at 400 Hz. Uniform across all 1,631 records: the array is
# rectangular and the shorter acquisitions are zero-padded into it.
duration_seconds: 10.24
sampling_rates: [400]
default_sampling_rate: 400

# --- File Structure ---
# Generated by SamiTropSplitter on first run: exams.csv plus the row reference
# that the release leaves implicit. The dataset root must be writable, because
# validate_dataset re-reads this file from disk rather than using the frame
# load_metadata returned.
metadata_csv: "ecgbench_metadata.csv"
metadata_csv_separator: ","
record_id_column: "exam_id"
# One recording per patient — the release is each patient's *first* exam — so
# there is nothing to group on. exam_id is already patient-unique.
patient_id_column: null

signal_path_columns:
  400: "signal_path"  # exams.hdf5:tracings:<row>

# --- Labels ---
# There is no diagnostic vocabulary to put here, so this names the stratification
# reduction the label loader derives. Train on `death`/`followup_years` for
# survival work or on `normal_ecg` for classification — not on this column.
label_column: "stratify_class"
label_format: "single"

stratification:
  # SamiTropSplitter stratifies on stratify_class from the label loader: DEATH
  # (104), NORMAL (283) or ABNORMAL_ALIVE (1,244). See the labels note below for
  # why it is not the death x normal_ecg cross.
  method: "custom_function"

# --- Predefined Splits ---
# The release defines none.
has_predefined_splits: false

# --- Quality Validation ---
validation:
  expected_leads: 12
  # Uniform: every record is exactly 4,096 samples, guaranteed by the array
  # being a single rectangular (1631, 4096, 12) block.
  expected_samples:
    400: 4096
  checks:
    - missing_leads
    - nan_values
    - truncated_signal
    - flat_line
    - corrupt_header
    - amplitude_outlier
  # Matches CODE-15% rather than the ECGBench-usual +-10 mV, for the same
  # reason: these are TNMG telehealth recordings made by non-specialist staff,
  # and they are noisy. Measured exclusion rates over all 1,631 records —
  # +-5 mV: 40.3%, +-10: 11.0%, +-15: 4.5%, +-20: 0.9%, +-30: 0.1%. +-10 would
  # discard 180 legitimate recordings; +-20 keeps exclusions near the 1% the
  # rest of the catalogue sits at while still catching railed leads (the worst
  # record peaks at 30.2 mV). Expect 2 records to fail missing_leads as well:
  # they carry a lead that is exactly zero throughout.
  amplitude_range_mv: [-20.0, 20.0]

# --- Labels ---
# Module-based: ecgbench/labels/sami_trop.py. The positional join, the
# stratification reduction and the sex column all need deriving, and the
# positional join in particular must be validated in exactly one place.
#
# NOT a diagnostic dataset. The only ECG label is the binary `normal_ecg` flag
# (286 of 1,631 normal); everything else is demographics and outcome. Note that
# every patient here already has chronic Chagas cardiomyopathy, so "normal ECG"
# means a normal tracing in a diseased cohort, not a healthy control.
labels:
  # Named even though the loader is a module (as ecgdmmld and echonext do): it is
  # the real single source, and manifest.py checksums it, which is what lets a
  # user confirm their copy against Zenodo's published md5.
  source_csv: "exams.csv"
  join_column: "exam_id"

# --- Croissant Metadata ---
croissant:
  keywords:
    - "ECG"
    - "electrocardiography"
    - "SaMi-Trop"
    - "Chagas disease"
    - "Chagas cardiomyopathy"
    - "Brazil"
    - "mortality"
    - "survival analysis"
    - "12-lead"
    - "HDF5"
  rai_data_collection: >
    Twelve-lead ECGs recorded in 2011-2012 from participants of SaMi-Trop, a
    prospective cohort study of chronic Chagas cardiomyopathy funded by the US
    National Institutes of Health and conducted in municipalities of northern
    Minas Gerais, Brazil. Participants were identified through the state
    telehealth network's ECG reporting service; recordings were made in
    primary-care units by non-specialist staff and reported remotely by
    cardiologists. This release contains the first ECG of each of 1,631
    participants of the 1,959-patient cohort, together with mortality follow-up
    ascertained through linkage to the Brazilian national mortality information
    system.
  rai_data_biases: >
    A single-disease, single-region cohort: every participant has chronic Chagas
    cardiomyopathy and was recruited in one part of one Brazilian state, so this
    is not a general population sample and carries no healthy controls. The
    `normal_ecg` flag therefore marks a normal tracing in a diseased cohort
    rather than a healthy subject. The cohort skews female (1,097 of 1,631,
    67.3%) and old (median age 59, range 26-98). The mortality endpoint is
    heavily imbalanced — 104 deaths in 1,631 patients (6.4%) over a median 2.07
    years of follow-up — and follow-up is short enough that a survivor is only
    known to have survived those few years. Recordings are noisier than a
    hospital cohort's, with a median per-record peak of 4.3 mV, and 2 records
    carry a lead that is flat zero throughout. Only 1,631 of the 1,959 enrolled
    patients are present, and the release does not say how the 328 absent
    patients differ.
  rai_personal_sensitive_info: >
    De-identified by the providers before release. Record identifiers are opaque
    integers from the telehealth network's own numbering and no patient
    identifier is published at all — which is sound here, since each patient
    contributes exactly one recording. Age in whole years and sex are retained.
    The release carries mortality outcome data: a death flag and time to death
    or censoring in years for every one of the 1,631 patients, of whom 104 died.
    That is sensitive health-outcome information about a specific disease cohort
    even though it names no one, and it is linked to a stigmatised condition of
    poverty. No dates, no free-text reports, no clinic identifiers and no
    geographic detail below state level ship.
