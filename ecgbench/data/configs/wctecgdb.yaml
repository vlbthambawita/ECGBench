# ECGBench Config: Wilson Central Terminal ECG Database
# =====================================================
# https://physionet.org/content/wctecgdb/1.0.1/
#
# 540 ten-second segments from 92 hospital-admitted cardiac patients, recorded
# with the three limb electrodes brought out individually so that the Wilson
# Central Terminal (WCT) — the reference against which V1-V6 are measured, and
# which conventional ECG assumes is 0 V — could be measured rather than assumed.
# It is not zero: the release's own paper reports WCT amplitudes reaching 241% of
# lead II. The dataset exists to quantify that error and to support true unipolar
# chest leads, so **the WCT channel is the point of the dataset, not an artefact**.
#
# FIVE THINGS THAT ARE NOT LIKE THE OTHER 12-LEAD DATASETS HERE
#
# 1. 37 channels, and NOT a 12-lead set. Each record holds 18 raw + 18 filtered
#    channels plus WCT: the three bipolar limb leads I, II, III; V1-V6; the three
#    limb electrode potentials LA, RA, LL; the six true unipolar chest leads
#    UV1-UV6; and WCT (filtered only). aVR, aVL and aVF are absent — derive them
#    from I and II if you need them. See lead_names for the exact file order.
# 2. Every channel ships twice, "-Raw" and filtered. Channels 0-17 are the raw
#    acquisition; channels 18-35 are the same signals after DC removal and a
#    0.05-150 Hz band-pass, and channel 36 is WCT. The raw limb-electrode and
#    unipolar channels carry a large DC offset — about -5 mV in patient001/seg01 —
#    which the filtered copies do not. Pick one family with leads=; mixing raw and
#    filtered channels in one tensor mixes two preprocessing states.
# 3. 800 Hz, 8001 samples. Not 500 Hz, and not a round number of samples: 8001
#    samples at 800 Hz is 10.00125 s. duration_seconds below is the nominal 10.
# 4. seg01 is not a unique record id — all 92 patient directories contain one.
#    The record id is the RECORDS path with the slash replaced
#    ("patient001_seg01"); the signal path keeps it ("patient001/seg01").
# 5. Eight records contain SYNTHESISED precordial channels, reconstructed as
#    V = UV - WCT because the recorded V channel was unusable (patients 007, 008,
#    010, 014, 031). They are flagged per record in the labels
#    (has_reconstructed_precordials) and must be excluded when evaluating
#    precordial reconstruction, which is this dataset's headline use — otherwise
#    the method under test is scored against its own output.
#
# AND TWO THINGS ABOUT THE LABELS
#
#   a. The only labels are age, sex and one free-text admission diagnosis, all
#      PER PATIENT rather than per segment (verified constant across all 540
#      headers). A segment labelled "Ventricular tachycardia (VT)" need not
#      contain VT. There is no beat, rhythm or interval annotation at all.
#   b. The diagnosis is 43 distinct free-text strings over 92 patients (40 after
#      correcting the misspellings), 28 of them held by a single patient, with
#      Windows-1252 bytes where a dash belongs. The label loader corrects the
#      spellings and reduces them to 8 groups for stratification;
#      that reduction is a judgement call and not a training target.

name: "Wilson Central Terminal ECG Database"
slug: "wctecgdb"
version: "1.0.1"
url: "https://physionet.org/content/wctecgdb/1.0.1/"
# The ~300 MB zip is genuinely public — no PhysioNet credentials needed:
#   wget https://physionet.org/static/published-projects/wctecgdb/wilson-central-terminal-ecg-database-1.0.1.zip
# It stays null anyway because `metadata_csv` below is generated by the splitter on
# first run, and `download_dataset` raises if it cannot find that file immediately
# after extraction.
download_url: null
license: "ODC-By 1.0 (Open Data Commons Attribution License)"
description: >
  Simultaneous conventional and true-unipolar 12-lead-style ECGs from 92 patients
  admitted to Campbelltown Hospital, Sydney, recorded so that the Wilson Central
  Terminal could be measured instead of assumed to be zero. Each of the 540
  ten-second segments holds 37 channels at 800 Hz: the bipolar limb leads I, II,
  III, the precordial leads V1-V6, the three limb electrode potentials LA, RA and
  LL, the six true unipolar chest leads UV1-UV6 and the WCT itself — each of the
  first 18 present both raw and after DC removal plus a 0.05-150 Hz band-pass. The
  cohort is elderly and cardiac (mean age 65.2, SD 12.1; 27 of 92 female), with one
  free-text admission diagnosis per patient and no beat-level annotation. Eight
  segments from five patients carry precordial channels synthesised as V = UV - WCT
  rather than recorded.
citation: >
  Moeinzadeh, H., & Gargiulo, G. (2019). Wilson Central Terminal ECG Database
  (version 1.0.1). PhysioNet. https://doi.org/10.13026/f73z-an96
doi: "10.13026/f73z-an96"

creators:
  - type: Person
    name: "Hossein Moeinzadeh"
    url: "https://physionet.org/content/wctecgdb/1.0.1/"
  - type: Person
    name: "Gaetano Gargiulo"
    url: "https://physionet.org/content/wctecgdb/1.0.1/"
  - type: Organization
    name: "MARCS Institute, Western Sydney University"
    url: "https://www.westernsydney.edu.au/marcs"

# --- Signal Properties ---
signal_format: "wfdb"
# 1.0: the per-channel header gains are genuine calibration, and wfdb applies them.
# Amplitudes come back as physiologic millivolts (filtered leads peak around
# 1-2 mV), unlike the min-max-normalised norwegian_athlete_ecg.
signal_unit_scale: 1.0
# A channel count, not a 12-lead set — see note 1 in the header above.
leads: 37
# Verified identical in all 540 headers. Channels 0-17 raw, 18-35 the filtered
# counterparts, 36 the WCT (filtered only; there is no WCT-Raw).
lead_names: ["I-Raw", "II-Raw", "III-Raw",
             "V1-Raw", "V2-Raw", "V3-Raw", "V4-Raw", "V5-Raw", "V6-Raw",
             "LA-Raw", "RA-Raw", "LL-Raw",
             "UV1-Raw", "UV2-Raw", "UV3-Raw", "UV4-Raw", "UV5-Raw", "UV6-Raw",
             "I", "II", "III",
             "V1", "V2", "V3", "V4", "V5", "V6",
             "LA", "RA", "LL",
             "UV1", "UV2", "UV3", "UV4", "UV5", "UV6",
             "WCT"]
duration_seconds: 10  # nominal; 8001 samples at 800 Hz is 10.00125 s
sampling_rates: [800]
default_sampling_rate: 800

# --- File Structure ---
# The release ships no metadata table — only the 540 .dat/.hea pairs under
# patient001/ .. patient092/, RECORDS, SHA256SUMS.txt and LICENSE.txt. WCTECGSplitter
# writes this file on first run from the header comments, because `validate_dataset`
# re-reads metadata_csv from disk rather than reusing the splitter's frame. The
# dataset root must therefore be writable.
metadata_csv: "ecgbench_metadata.csv"
metadata_csv_separator: ","
record_id_column: "record_name"   # patient001_seg01 — see note 4 in the header above
patient_id_column: "patient_id"   # patient001; 540 segments from 92 patients, 1-31 each

signal_path_columns:
  800: "signal_path"  # nested, e.g. patient001/seg01

# --- Labels ---
label_column: "diagnosis_group"
label_format: "single"

stratification:
  # Custom: the label loader parses the header comments and reduces the 43
  # free-text admission diagnoses to 8 groups; the splitter stratifies on that.
  # The strings themselves cannot be stratified on — 28 of the 40 corrected values
  # occur for exactly one patient. Even after the reduction, three of the 8 groups
  # hold 3-6 patients, which is fewer than the 10 folds: with n_folds=10 the
  # Bradyarrhythmia group (3 patients) reaches only 3 folds, and the default test
  # fold holds no bradyarrhythmia and no cardiomyopathy record at all.
  # StratifiedGroupKFold does not warn about this the way StratifiedKFold does, so
  # check the per-fold distribution rather than trusting the silence.
  method: "custom_function"

# --- Predefined Splits ---
has_predefined_splits: false

# --- Quality Validation ---
validation:
  expected_leads: 37
  expected_samples:
    800: 8001  # uniform: all 540 headers declare exactly 8001
  checks:
    - missing_leads
    - nan_values
    - truncated_signal
    - flat_line
    - corrupt_header
    - amplitude_outlier
  # Wide on purpose, and not a physiological range. The raw limb-electrode and
  # unipolar channels are unreferenced potentials carrying several mV of DC offset
  # before the DC-removal filter, and the observed extremes across all 540 records
  # x 37 channels are -16.51 to +9.23 mV. [-20, 20] passes every record.
  #
  # It cannot usefully be tightened, because the check would then fire on the
  # dataset's real acquisition rail rather than on damage: 140 of the 540 records
  # have at least one channel clipped at exactly +/-9.2250 mV (128,802 samples in
  # all, 61 records with a plateau of 10 ms or longer, longest 227.5 ms in
  # patient069/seg07 UV1-Raw), overwhelmingly in the raw unipolar UV*-Raw and
  # LA/RA-Raw channels. Saturation of the unreferenced channels is a property of
  # the release; check for the rail yourself if it matters to you.
  amplitude_range_mv: [-20.0, 20.0]

# --- Labels ---
# Module-based: ecgbench/labels/wctecgdb.py parses the #Age:, #Sex:,
# #Diagnosis report: and #Reconstruct Precordials: header comment lines.
# source_csv is null because the labels live in the .hea files themselves, so
# load_labels() works on a fresh copy of the dataset with no prior
# `ecgbench splits` run.
labels:
  source_csv: null
  join_column: "record_name"

# --- Croissant Metadata ---
croissant:
  keywords:
    - "ECG"
    - "electrocardiography"
    - "Wilson Central Terminal"
    - "unipolar leads"
    - "precordial leads"
    - "lead reconstruction"
    - "biomedical instrumentation"
    - "800 Hz"
    - "PhysioNet"
  rai_data_collection: >
    Ten-second resting ECG segments from 92 patients admitted to Campbelltown
    Hospital, Sydney, Australia, recorded by the MARCS Institute at Western Sydney
    University with the left-arm, right-arm and left-leg electrode potentials
    acquired individually so that the Wilson Central Terminal could be computed and
    the six chest electrodes referenced against it, yielding true unipolar chest
    leads UV1-UV6 alongside the conventional V1-V6. Each channel is published both
    raw and after DC removal and a 0.05-150 Hz band-pass. Patients contributed 1 to
    31 segments each. Age, sex and a single free-text admission diagnosis were
    transcribed per patient into the WFDB headers; no beat, rhythm or interval
    annotation was performed. Eight segments from five patients have precordial
    channels synthesised as V = UV - WCT because the recorded channel was unusable.
  rai_data_biases: >
    540 segments is a record count, not an independent sample count: they come from
    92 patients, unevenly, with one patient contributing 31 segments (5.7% of the
    dataset) and 18 patients contributing one each. Age, sex and diagnosis are
    constant within a patient, so any per-record statistic is weighted by segment
    count rather than by person, and a model evaluated without patient-level
    grouping is largely re-reading its training data. The cohort is narrow and
    clinical: hospital-admitted, elderly (mean 65.2 years, range 41-94), 71% male,
    predominantly with existing cardiac disease, from one hospital in one city on
    one instrumentation setup. The diagnosis field is free text written per
    admission, 43 distinct strings over 92 patients with 30 singletons,
    misspellings and Windows-1252 bytes; it describes why the patient was admitted,
    not what the ten seconds of ECG shows, and 10 patients have no diagnosis
    recorded at all. It is therefore unusable as a waveform label. The eight
    records with synthesised precordial channels satisfy V = UV - WCT exactly by
    construction, so including them when evaluating precordial reconstruction
    inflates the result.
  rai_personal_sensitive_info: >
    De-identified. Records are numbered patient001-patient092 with segments seg01
    onwards, and carry no names, dates or hospital identifiers. Age in years, sex
    and a free-text admission diagnosis are present in the headers; the diagnosis
    strings are clinical prose describing individual admissions ("Fall secondary to
    alcohol intoxication", "Gastritis (non cardiac chest pain)"), which is why
    ECGBench publishes fold CSVs of identifiers only and never the label columns.
    Ages are exact rather than banded, and 94 is above the 89-year threshold that
    HIPAA-style de-identification would generalise.
