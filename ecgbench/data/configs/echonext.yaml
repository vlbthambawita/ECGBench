# EchoNext — 100,000 ECGs labelled with echocardiography-derived structural
# heart disease, from Columbia University Irving Medical Center.
#
# Two things here are unlike every other ECGBench dataset:
#
# 1. signal_format is `npy`. Records are not files — they are ROWS of one shared
#    array per split, so signal_path carries "<file>.npy:<row>". The splitter
#    generates those references into ecgbench_metadata.csv.
# 2. signal_units is `zscore`. The publisher median-filtered, percentile-clipped
#    and standardised the waveforms with a dataset-wide mean and SD they did not
#    release, so millivolts are unrecoverable. ECGDataset(units=...) refuses to
#    convert them and amplitude_outlier is skipped rather than firing on all
#    82,543 records.

# --- Identity ---
name: "EchoNext"
slug: "echonext"
version: "1.1.0"
url: "https://physionet.org/content/echonext/1.1.0/"
download_url: null                # Credentialed access, and the splitter generates metadata_csv
license: "PhysioNet Restricted Health Data License 1.5.0"
description: >
  100,000 12-lead ECGs from Columbia University Irving Medical Center and Allen
  Hospital, each paired with structural heart disease labels derived from a
  matched echocardiogram. Waveforms are 10 s at 250 Hz, shipped preprocessed
  (median-filtered, percentile-clipped, standardised) as one NumPy array per
  split. The headline target is shd_moderate_or_greater_flag, a composite of ten
  per-condition echo findings. ECGBench honours the publisher's own train/val/test
  assignment and excludes the 17,457 no_split records, which share patients with
  val and test.
citation: >
  Poterucha TJ, et al. Detecting structural heart disease from electrocardiograms
  using AI. Nature (2025).
doi: "10.1038/s41586-025-09227-0"

creators:
  - type: Organization
    name: "Columbia University Irving Medical Center"
    url: "https://www.cuimc.columbia.edu/"

# --- Signal Properties ---
signal_format: "npy"
signal_unit_scale: 1.0            # Nothing to scale — see signal_units below
signal_units: "zscore"            # NOT millivolts, and not convertible to them
leads: 12
# The release does not state a lead order. Inferred from the arrays (last axis):
# Einthoven's III = II - I and the Goldberger relations hold to a residual SD of
# 0.13-0.19 against a signal SD of 0.92, while deliberately wrong pairings give
# 1.06-1.56. Not exact because the per-lead median filter and percentile clip are
# nonlinear, but the order is unambiguous.
lead_names: ["I", "II", "III", "aVR", "aVL", "aVF", "V1", "V2", "V3", "V4", "V5", "V6"]
duration_seconds: 10
sampling_rates: [250]
default_sampling_rate: 250

# --- File Structure ---
# Generated by EchoNextSplitter, not shipped: the release has no per-record paths
# because records are rows of shared arrays. validate_dataset re-reads this file
# from disk, so the row references must be written here rather than built in memory.
metadata_csv: "ecgbench_metadata.csv"
metadata_csv_separator: ","
record_id_column: "ecg_key"
patient_id_column: "patient_key"

signal_path_columns:
  250: "signal_path"              # "EchoNext_<split>_waveforms.npy:<row>"

# --- Labels ---
label_column: "shd_moderate_or_greater_flag"
label_format: "single"

stratification:
  method: "custom_function"       # EchoNextSplitter; the split is predefined anyway
  mapping_source: null
  superclass_column: null

# --- Predefined Splits ---
# The publisher's own assignment. Train may hold several ECGs per patient; val and
# test hold only each patient's latest. Verified patient-disjoint: 0 patients are
# shared between any pair of the three. There is no fold 4 — no_split is dropped
# by the splitter, because export.py maps an unmapped fold to "train" and that
# would put 2,499 test patients' and 2,119 val patients' earlier ECGs in training.
has_predefined_splits: true
predefined_splits:
  column: "fold"
  fold_mapping:
    train: [1]
    val: [2]
    test: [3]

# --- Quality Validation ---
validation:
  expected_leads: 12
  expected_samples:
    250: 2500                     # 10 s x 250 Hz, uniform across all 82,543 records
  checks:
    - missing_leads
    - nan_values
    - truncated_signal
    - flat_line
    - corrupt_header
    # amplitude_outlier is deliberately absent: its thresholds are millivolts and
    # these samples are z-scores. The engine also skips it for signal_units != mV,
    # so adding it back here would be a no-op rather than a silent failure.
  amplitude_range_mv: [-10.0, 10.0]

# --- Labels ---
# Dispatched to ecgbench/labels/echonext.py, which reads the release's own
# echonext_metadata_100k.csv — so labels do not depend on `ecgbench splits`
# having run. It adds a <flag>_measured mask beside every per-condition flag,
# because an unmeasured echo value is recorded as a 0 flag rather than a null
# (55% of tr_max_gte_32_flag and 43% of pasp_gte_45_flag are "negative" that way).
labels:
  source_csv: "echonext_metadata_100k.csv"
  separator: ","
  join_column: "ecg_key"
  columns: null

# --- Distribution policy ---
# The PhysioNet Restricted Health Data License, clause 3: "The LICENSEE will not
# share access to PhysioNet restricted data with anyone else." Fold CSVs are
# identifiers only, but they are still data derived under that agreement and the
# ECGBench Hub repo is public and ungated.
publish_fold_csvs: false
no_publish_reason: >
  EchoNext is released under the PhysioNet Restricted Health Data License 1.5.0,
  whose clause 3 forbids sharing access to the data with anyone else, so ECGBench
  does not republish its identifiers — not even the ecg_key and patient_key
  columns of a fold table. Regenerate the identical split from your own copy with:
  ecgbench splits --dataset echonext --data-path /path/to/echonext/1.1.0/
  then confirm it is the canonical partition with
  ecgbench.manifest.verify_splits("echonext", "output/echonext").

# --- Croissant Metadata ---
croissant:
  keywords:
    - "ECG"
    - "electrocardiography"
    - "echocardiography"
    - "structural heart disease"
    - "deep learning"
  rai_data_collection: >
    Retrospective collection of 100,000 12-lead ECGs from Columbia University
    Irving Medical Center and Allen Hospital, each paired with a matched
    echocardiogram. Labels are derived from the echo report, binarised at
    clinically relevant thresholds. Waveforms were median-filtered, clipped at the
    0.1st and 99.9th percentiles and standardised before release.
  rai_data_biases: >
    Single health system in New York City, so case mix and demographics reflect
    that catchment rather than a general population. Records are ECGs that had a
    matched echocardiogram, which selects for patients with a clinical reason to
    be imaged — structural heart disease prevalence here (52% of train) is far
    above the population rate. Age is capped at 90. Train may contain several
    ECGs per patient while val and test hold only the latest, so the three splits
    differ in composition as well as size.
  rai_personal_sensitive_info: >
    De-identified but restricted health data. Patient identifiers are surrogate
    keys; acquisition dates are reduced to a year and age is capped at 90.
    Distributed under the PhysioNet Restricted Health Data License, which forbids
    re-sharing; ECGBench therefore publishes no fold CSVs for this dataset.
