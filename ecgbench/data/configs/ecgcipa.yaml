# ECGBench Config: CiPA ECG Validation Study
# ==========================================
# https://physionet.org/content/ecgcipa/1.0.0/
#
# 5,749 ten-second 12-lead ECGs at 1 kHz from 60 healthy volunteers in a
# double-blind randomised Phase I study (SCR-004, NCT03070470) run to validate the
# CiPA hypothesis: that exposure-response analysis of QTc *and* J-Tpeakc can tell a
# "balanced ion channel" blocker (hERG block plus roughly equipotent late-sodium or
# L-type-calcium block) apart from a "predominant hERG" blocker, using only Phase I
# data. Part 1 is a 50-subject parallel design (subjects 1001-1050, ten each on
# ranolazine, verapamil, lopinavir+ritonavir, chloroquine or placebo); Part 2 is a
# 10-subject two-period crossover (subjects 2001-2010) of dofetilide against
# diltiazem+dofetilide.
#
# This is a **pharmacology dataset, not a diagnosis dataset**. Nobody in it has a
# cardiac condition; what varies across records is drug, dose-time and the
# resulting interval change. There is no rhythm or morphology class to predict, so
# every ECGBench dataset habit built around a diagnosis label needs rethinking
# here — starting with stratification, which uses the treatment in effect.
#
# SIX THINGS THAT ARE NOT LIKE THE OTHER 12-LEAD DATASETS HERE
#
# 1. Every record ships TWICE, and only one copy is the ECG. `raw/<subject>/<uuid>`
#    is the 10 s 12-lead acquisition and is what this config points at.
#    `medians/<subject>/<uuid>` is a *derived* representative median beat — 16
#    channels (the 12 leads plus the vector-magnitude lead VCGMAG and the Frank X,
#    Y, Z components), 1,200 samples, same 1 kHz — carrying the `.atr` fiducial
#    annotations. Same record id, same acquisition, different object. The median
#    beats get no fold of their own (that would be a second ECGBench partition of
#    the same recordings); the label loader exposes their paths and fiducials
#    instead.
# 2. Records come in TRIPLICATE. Three 10 s segments were extracted per
#    (subject, period, nominal timepoint) for 1,916 of the 1,917 timepoint groups —
#    5,749 = 1,916 x 3 + 1 — seconds apart, from the same subject in the same
#    posture at the same drug concentration. They are near-duplicates. Patient
#    grouping keeps all three on one side of the split; nothing else would.
# 3. 1000 Hz, and the samples are MICROVOLTS. The header declares gain
#    0.26595744680851063 ADU per uV with unit `/uV`, identically in all 5,749
#    records, so `wfdb.rdrecord` hands back microvolts and signal_unit_scale must
#    be 0.001. Verified: peak amplitudes then land at 1-4 mV.
# 4. Lead order is standard but the SPELLING is lowercase-a: I, II, III, aVR, aVL,
#    aVF, V1-V6 (PTB-XL writes AVR). Matching in ECGDataset(leads=...) is
#    case-insensitive, so either works; lead_names records what the files say.
#    Note the median-beat headers spell the same leads AVR/AVL/AVF — the two
#    directories disagree with each other.
# 5. There is NO shipped metadata table mapping records to files. adeg.csv is a
#    long-format measurement table (9 parameters x record) and the record-to-subject
#    mapping lives in the WFDB header comments. ECGCIPASplitter builds
#    `ecgbench_metadata.csv` on first run, so the dataset root must be writable.
# 6. The interval measurements ARE the annotations. The `.atr` fiducials on the
#    median beat reproduce adeg.csv's intervals exactly — for record
#    00689D31-...D47C, QRS onset 353 ms to T offset 724 ms is adeg's QT of 371 ms,
#    to the millisecond. Neither is an independent check on the other.
#
# AND THE ONE TRAP THAT WILL COST YOU AN AFTERNOON
#
#   adeg.csv holds 69,556 rows, but only 51,686 of them belong to a record. The
#   other 17,870 have `DTYPE=AVERAGE` and a **blank EGREFID**: they are the mean
#   over each triplicate, and they are the ONLY rows where `BASE` (baseline),
#   `CHG` (change from baseline), `CCOMPCHG` (placebo-corrected change) and
#   `ABLFL` are populated. On the per-record rows all four are 100% null. So the
#   study's actual endpoints — delta-QTc, delta-J-Tpeakc — exist per timepoint and
#   cannot be attached to a waveform at all. The label loader exposes the
#   per-record measurements and says so; see ecgbench/labels/ecgcipa.py if you need
#   the triplicate means.

name: "CiPA ECG Validation Study"
slug: "ecgcipa"
version: "1.0.0"
url: "https://physionet.org/content/ecgcipa/1.0.0/"
# The ~1.5 GB release is genuinely public — no PhysioNet credentials needed:
#   wget -r -N -c -np https://physionet.org/files/ecgcipa/1.0.0/
# It stays null because `metadata_csv` below is generated by the splitter on first
# run, and `download_dataset` raises if it cannot find that file immediately after
# extraction.
download_url: null
license: "ODC-By 1.0 (Open Data Commons Attribution License)"
description: >
  5,749 ten-second 12-lead ECGs at 1 kHz from 60 healthy volunteers in the CiPA
  Phase I ECG biomarker validation study (SCR-004, NCT03070470), a double-blind
  randomised trial testing whether QTc together with J-Tpeakc can separate
  balanced ion-channel block from predominant hERG block using Phase I data alone.
  Fifty subjects (1001-1050) were randomised in parallel to three days of
  ranolazine, verapamil, lopinavir+ritonavir, chloroquine or placebo, ten each;
  ten more (2001-2010) took part in a two-period crossover of dofetilide against
  diltiazem+dofetilide. Records were extracted in triplicate at 28 nominal
  timepoints spanning -1 to 73 hours from dosing, and each is published both as the
  raw 10 s segment and as a derived 16-channel median beat carrying semi-automatic
  P-onset, QRS-onset, QRS-offset, T-peak and T-offset annotations on the
  vector-magnitude lead. Per-record heart rate, RR, PR, QRS, QT, QTcF, J-Tpeak,
  J-Tpeakc and Tpeak-Tend accompany the waveforms, alongside plasma concentrations
  of each analyte and subject demographics. No participant had cardiac disease:
  the label of interest is drug exposure, not diagnosis.
citation: >
  Vicente J, Zusterzeel R, Johannesen L, Ochoa-Jimenez R, Mason JW, Sanabria C,
  Kemp S, Sager PT, Patel V, Matta MK, Liu J, Florian J, Garnett C, Stockbridge N,
  Strauss DG (2019). Assessment of Multi-Ion Channel Block in a Phase I Randomized
  Study Design: Results of the CiPA Phase I ECG Biomarker Validation Study.
  Clinical Pharmacology & Therapeutics 105(4):943-953.
  https://doi.org/10.1002/cpt.1303 — data: PhysioNet,
  https://doi.org/10.13026/C2967M
doi: "10.13026/C2967M"

creators:
  - type: Person
    name: "Jose Vicente"
    url: "https://physionet.org/content/ecgcipa/1.0.0/"
  - type: Person
    name: "Robbert Zusterzeel"
    url: "https://physionet.org/content/ecgcipa/1.0.0/"
  - type: Person
    name: "Lars Johannesen"
    url: "https://physionet.org/content/ecgcipa/1.0.0/"
  - type: Person
    name: "David G. Strauss"
    url: "https://physionet.org/content/ecgcipa/1.0.0/"
  - type: Organization
    name: "US Food and Drug Administration, Center for Drug Evaluation and Research"
    url: "https://www.fda.gov/about-fda/center-drug-evaluation-and-research-cder"

# --- Signal Properties ---
signal_format: "wfdb"
# 0.001: the headers declare gain 0.26595744680851063 with unit `/uV`, so
# wfdb.rdrecord returns MICROVOLTS, not millivolts. Left at 1.0, every record's
# peak reads as ~2000 "mV" and amplitude_outlier fires on all 5,749.
signal_unit_scale: 0.001
leads: 12
# Verified identical in all 5,749 raw headers. Lowercase 'a' — the median-beat
# headers under medians/ spell the same three leads AVR/AVL/AVF instead.
lead_names: ["I", "II", "III", "aVR", "aVL", "aVF",
             "V1", "V2", "V3", "V4", "V5", "V6"]
duration_seconds: 10
sampling_rates: [1000]
default_sampling_rate: 1000

# --- File Structure ---
# The release ships adeg/adpc/adsl/addm.csv — clinical analysis datasets in
# long format — but no table mapping records to signal files. The
# record-to-subject link lives in each header's comment block
# ("# SCR-004,1001,00689D31-...,20170327065710.000,raw"). ECGCIPASplitter writes
# this file on first run, because validate_dataset re-reads data_path /
# metadata_csv from disk rather than reusing the splitter's frame.
metadata_csv: "ecgbench_metadata.csv"
metadata_csv_separator: ","
# The EGREFID UUID. Unique across the whole release (5,749 distinct for 5,749
# records), so no compounding with the subject is needed — unlike wctecgdb's seg01.
record_id_column: "record_id"
patient_id_column: "patient_id"   # USUBJID; 5,749 records from 60 subjects, 24-168 each

signal_path_columns:
  1000: "signal_path"  # raw/<USUBJID>/<EGREFID>, e.g. raw/1001/00689D31-8491-...

# --- Labels ---
label_column: "treatment"
label_format: "single"

stratification:
  # Custom: the splitter stratifies on `treatment` (adeg's TRTA, the treatment
  # actually in effect when the record was taken) and groups on `patient_id`.
  #
  # Treatment is the only categorical worth balancing in a cohort with no disease,
  # and it is what a drug-effect model is trained to separate. Two caveats:
  #
  #  - It is *record*-level, not patient-level. The ten crossover subjects
  #    (2001-2010) carry two treatments each, so grouping by patient necessarily
  #    puts both a dofetilide and a diltiazem+dofetilide block in the same fold.
  #  - Balance is good but thin in places. 60 patients over 10 folds is 6 per
  #    fold, and each of the 7 treatments has exactly 10 patients, so all 7 do
  #    reach all 10 folds — 84 records per treatment per fold in 61 of the 70
  #    cells. The exceptions are Verapamil in fold 5 (24 records) and
  #    Diltiazem+Dofetilide in folds 8 and 10 (51 each), which is why fold sizes
  #    run 528-588 rather than a uniform 575. StratifiedGroupKFold emits no
  #    "least populated class" warning, so read the crosstab before quoting a
  #    per-arm result off one fold.
  #
  # Grouping also keeps each triplicate intact: all 3 records of every one of the
  # 1,917 (subject, period, timepoint) groups land in the same fold.
  method: "custom_function"

# --- Predefined Splits ---
has_predefined_splits: false

# --- Quality Validation ---
validation:
  expected_leads: 12
  expected_samples:
    1000: 10000  # uniform: all 5,749 headers declare exactly 10000 samples at 1000 Hz
  checks:
    - missing_leads
    - nan_values
    - truncated_signal
    - flat_line
    - corrupt_header
    - amplitude_outlier
  # The house default, and it does real work here rather than passing everything.
  # Scanned over all 5,749 records x 12 leads x 10,000 samples the observed range
  # is -18.85 to +10.93 mV, but the distribution is tight: the 99.9th percentile of
  # per-record peak absolute amplitude is 4.15 mV and only 4 records exceed 5 mV.
  # [-10, 10] therefore excludes exactly 2 records — 60D0B564-186D-4027-8B32-5B9D14278EBD
  # (subject 1024, leads II/III/aVF to -18.9 mV) and
  # 25A3D6EC-303B-4092-8FC3-C828876115BC (subject 1043, V5/V6 to +10.9 mV) — which
  # are electrode artefacts, not physiology. No record has a flat or missing lead
  # (minimum per-lead variance across the release is 5.6e-4 mV^2) and none has a
  # NaN sample, so amplitude_outlier is the only check that fires at all.
  amplitude_range_mv: [-10.0, 10.0]

# --- Labels ---
# Module-based: ecgbench/labels/ecgcipa.py joins four clinical analysis datasets
# (adeg, adpc, adsl, addm) into one per-record frame and adds the median-beat path.
# source_csv names adeg.csv because that is the file the loader cannot work
# without, so a missing-file error points at the right thing; the loader reads the
# other three itself.
labels:
  source_csv: "adeg.csv"
  join_column: "EGREFID"

# --- Croissant Metadata ---
croissant:
  keywords:
    - "ECG"
    - "electrocardiography"
    - "QT interval"
    - "J-Tpeak"
    - "proarrhythmia"
    - "CiPA"
    - "ion channel block"
    - "clinical pharmacology"
    - "Phase I trial"
    - "exposure-response"
    - "pharmacokinetics"
    - "1000 Hz"
    - "PhysioNet"
  rai_data_collection: >
    Continuous 12-lead ECG was recorded from 60 healthy volunteers at a single US
    Phase I clinical pharmacology unit under study SCR-004 (ClinicalTrials.gov
    NCT03070470), a double-blind randomised trial designed by the US FDA's Center
    for Drug Evaluation and Research to validate the CiPA Phase I ECG biomarker
    approach. Fifty subjects (1001-1050) were randomised in parallel, ten per group,
    to three consecutive days of ranolazine, verapamil, lopinavir+ritonavir,
    chloroquine or placebo; ten further subjects (2001-2010) completed a two-period
    crossover of dofetilide against diltiazem+dofetilide, dosed on days 1-3 and
    8-10. Three ten-second 12-lead segments were extracted per subject per nominal
    timepoint at 28 timepoints from one hour before dosing to 73 hours after, at
    1 kHz, yielding 5,749 records. A representative median beat was derived per
    record and annotated semi-automatically on the vector-magnitude lead for P
    onset, QRS onset, QRS offset, T peak (with a secondary T peak where present)
    and T offset; heart rate, RR, PR, QRS, QT, QTcF, J-Tpeak, J-Tpeakc and
    Tpeak-Tend were measured from those fiducials. Blood was drawn for plasma
    concentration of each analyte at the post-dose timepoints. Recordings span
    2017-03-27 to 2017-06-26.
  rai_data_biases: >
    This cohort is healthy by design and is not a clinical population: 60
    volunteers aged 19-50 (mean 31.7), 38 male and 22 female, screened to exclude
    cardiac disease. Nothing in it supports training or evaluating a diagnostic
    model — there is no arrhythmia, no structural disease and no rhythm label, and
    QT prolongation here is drug-induced in healthy hearts rather than pathological.
    5,749 is a record count, not an independent sample count, and it overstates
    independence twice over. Records come from 60 people, 24 to 168 each, so any
    per-record statistic is weighted by how many timepoints a subject completed
    rather than by person. Worse, they come in near-duplicate triplicates: three
    segments were extracted per subject per timepoint for 1,916 of 1,917 timepoint
    groups, seconds apart at the same drug concentration, so the effective sample
    size is closer to 1,917 than 5,749 and a split that ignores patient grouping is
    largely testing on its own training data. Treatment groups are small in the
    unit that matters — ten subjects per arm, five per crossover sequence — so
    per-arm effects rest on ten people each. Demographics skew young and male, and
    race is recorded as 32 Black or African American, 24 White and 4 Asian, which is
    not the distribution of any patient population. Interval measurements are
    incomplete for 19 records: 10 lack PR because no P onset could be annotated, and
    9 lack QT, QTcF, J-Tpeak, J-Tpeakc and Tpeak-Tend because no T annotation could
    be placed. Finally, the study's own endpoints — change from baseline and
    placebo-corrected change — exist only on adeg.csv's triplicate-average rows,
    which carry no record identifier and therefore cannot be attached to any
    waveform; the per-record measurements published here are absolute intervals.
  rai_personal_sensitive_info: >
    De-identified trial data released under an Open Data Commons Attribution
    License. Subjects are numbered 1001-1050 and 2001-2010 with no names or site
    detail beyond a single study code, and records are named by opaque UUID. The
    clinical analysis datasets do carry attributes that are personal in aggregate:
    exact age in years (19-50), sex, race, ethnicity, height, weight, BMI, resting
    blood pressure, per-timepoint plasma drug concentration, treatment assignment,
    and acquisition timestamps to the second spanning March to June 2017. With 60
    subjects in one unit over one quarter, those together are more identifying than
    any one of them; this is why ECGBench publishes fold CSVs of record and subject
    identifiers only and never the label columns, and why load_labels requires a
    local copy of the release.
