# ECGBench Config: Norwegian Endurance Athlete ECG Database
# =========================================================
# https://physionet.org/content/norwegian-athlete-ecg/1.0.0/
#
# 28 records, one per athlete, 12 leads at 500 Hz for 10 seconds — uniform
# geometry, no missing leads, no NaNs. The point of the dataset is not its size
# but its *double* interpretation: every record carries both the GE Marquette
# SL12 algorithm's reading and a cardiologist's, appended to the WFDB header as
# `#SL12:` and `#C:` comment lines. Comparing the two is the intended use, and
# the disagreement is stark: SL12 raises a `***Critical test result: STEMI`
# alert on 4 of the 28 athletes, three of whom the cardiologist reads as a plain
# "Normal ECG".
#
# TWO THINGS TO KNOW BEFORE YOU TRAIN ON THE WAVEFORMS
#
# 1. The samples are NOT calibrated amplitudes. Every lead of every record is
#    independently min-max normalised to the full signed 16-bit range: all 336
#    lead-records have their minimum at exactly -32767 and their maximum within
#    8 counts of +32767. The `50000/mV` gain in the headers is nominal, so wfdb
#    hands back values spanning exactly +/-0.6553 mV for every lead. Amplitude
#    is therefore meaningless in absolute terms AND incomparable between leads,
#    which rules out voltage criteria (LVH, ST elevation in mm) and any model
#    that relies on relative lead amplitudes. Morphology and timing survive.
#    This is undocumented upstream — PhysioNet describes only "16-bit, 50000/mV"
#    — and was established from the files. See the dataset page for the check.
#
# 2. Because of (1), `missing_leads` and `flat_line` cannot fire. A disconnected
#    or railed lead would be rescaled to full amplitude like any other, so the
#    two checks that exist to catch dead leads are blind here. They are kept in
#    the checks list to record that they ran, not because they can catch
#    anything.

name: "Norwegian Endurance Athlete ECG Database"
slug: "norwegian_athlete_ecg"
version: "1.0.0"
url: "https://physionet.org/content/norwegian-athlete-ecg/1.0.0/"
# The 1.7 MB zip is genuinely public — no PhysioNet credentials needed:
#   wget https://physionet.org/static/published-projects/norwegian-athlete-ecg/norwegian-endurance-athlete-ecg-database-1.0.0.zip
# It stays null anyway because `metadata_csv` below is generated by the splitter
# on first run, and `download_dataset` raises if it cannot find that file
# immediately after extraction.
download_url: null
license: "CC-BY-4.0"
description: >
  Twelve-lead resting ECGs from 28 elite Norwegian endurance athletes — 24
  rowers, 2 kayakers and 2 cyclists, 19 men and 9 women aged 20-43, training
  roughly 800 hours a year — recorded at the University of Oslo in February and
  March 2020 on a GE MAC VUE 360. Each record is 10 seconds at 500 Hz and was
  interpreted twice: once by the GE Marquette SL12 algorithm (version 23, v243)
  and once by a cardiologist trained in athlete ECG interpretation using
  international criteria. Both readings ship as free-text comment lines in the
  WFDB header. The dataset exists to expose how badly general-purpose automated
  interpretation over-calls findings in hearts remodelled by endurance training;
  no echocardiography was performed, so athletic remodelling is not confirmed
  per athlete. Waveform amplitudes are per-lead normalised rather than
  calibrated — see the header comment above.
citation: >
  Singstad, B. (2022). Norwegian Endurance Athlete ECG Database (version 1.0.0).
  PhysioNet. https://doi.org/10.13026/qpjf-gk87
doi: "10.13026/qpjf-gk87"

creators:
  - type: Person
    name: "Bjørn-Jostein Singstad"
    url: "https://physionet.org/content/norwegian-athlete-ecg/1.0.0/"
  - type: Organization
    name: "University of Oslo"
    url: "https://www.uio.no/english/"

# --- Signal Properties ---
signal_format: "wfdb"
# 1.0 because wfdb already applies the header's 50000/mV gain. It does NOT mean
# the result is a calibrated millivolt reading — see note 1 in the header above.
# There is no scale factor that could fix this: the normalisation was per lead,
# so the information needed to invert it is not in the release.
signal_unit_scale: 1.0
leads: 12
# Verified identical in all 28 headers. Uppercase augmented leads, as PTB-XL
# spells them — not the aVR/aVL/aVF of MIMIC-IV-ECG.
lead_names: ["I", "II", "III", "AVR", "AVL", "AVF",
             "V1", "V2", "V3", "V4", "V5", "V6"]
duration_seconds: 10
sampling_rates: [500]
default_sampling_rate: 500

# --- File Structure ---
# The release ships no metadata table at all — only the .dat/.hea pairs, RECORDS,
# SHA256SUMS.txt and LICENSE.txt. NorwegianAthleteECGSplitter writes this file on
# first run from the header comments, because `validate_dataset` re-reads
# metadata_csv from disk rather than reusing the splitter's frame. The dataset
# root must therefore be writable.
metadata_csv: "ecgbench_metadata.csv"
metadata_csv_separator: ","
record_id_column: "record_name"
patient_id_column: null  # 28 records, 28 athletes; no patient column exists

signal_path_columns:
  500: "signal_path"  # bare record stem, e.g. ath_001

# --- Labels ---
label_column: "cardiologist_primary_rhythm"
label_format: "single"

stratification:
  # Custom: the label loader parses the header comments and the splitter takes
  # the cardiologist's rhythm from it. The cardiologist *verdict* would be a
  # degenerate stratification target — 26 of 28 records are "Normal ECG" — so
  # the rhythm (16 normal sinus / 7 sinus arrhythmia / 5 sinus bradycardia) is
  # used instead.
  method: "custom_function"

# --- Predefined Splits ---
has_predefined_splits: false

# --- Quality Validation ---
validation:
  expected_leads: 12
  expected_samples:
    500: 5000  # uniform: all 28 headers declare exactly 5000
  checks:
    - missing_leads    # cannot fire here — see note 2 in the header above
    - nan_values
    - truncated_signal
    - flat_line        # cannot fire here — see note 2 in the header above
    - corrupt_header
    - amplitude_outlier
  # Deliberately tight, and not a physiological range. Per-lead normalisation
  # pins every lead to +/-0.6553 mV, so [-10, 10] could never fire on anything.
  # +/-1.0 still passes all 28 records while flagging any future record that is
  # not normalised the same way.
  amplitude_range_mv: [-1.0, 1.0]

# --- Labels ---
# Module-based: ecgbench/labels/norwegian_athlete_ecg.py parses the `#SL12:` and
# `#C:` header comment lines. source_csv is null because the labels live in the
# .hea files themselves, so load_labels() works on a fresh copy of the dataset
# without a prior `ecgbench splits` run.
labels:
  source_csv: null
  join_column: "record_name"

# --- Croissant Metadata ---
croissant:
  keywords:
    - "ECG"
    - "electrocardiography"
    - "athletes"
    - "sports cardiology"
    - "athlete's heart"
    - "12-lead"
    - "GE Marquette SL12"
    - "automated interpretation"
    - "cardiologist interpretation"
    - "PhysioNet"
  rai_data_collection: >
    Resting 10-second 12-lead ECGs recorded on a GE MAC VUE 360 at the University
    of Oslo in February and March 2020 from 28 elite endurance athletes recruited
    from Norwegian rowing, kayaking and cycling. Each recording was interpreted
    twice and independently: by the GE Marquette SL12 algorithm (version 23,
    v243) and by a cardiologist trained in athlete ECG interpretation applying
    international criteria. Both interpretations are stored verbatim as WFDB
    header comments. No echocardiography was performed, so the presence of
    athletic cardiac remodelling is not confirmed for any individual athlete.
  rai_data_biases: >
    28 records is far too few to train on and small enough that a single record
    moves any rate by 3.6 percentage points. The cohort is narrow by design and
    unrepresentative of any clinical population: elite endurance athletes only,
    86% rowers, 68% male, aged 20-43, all Norwegian, all recruited at one
    institution on one device. Labels are correspondingly degenerate — the
    cardiologist calls 26 of 28 records "Normal ECG" and the remaining 2
    "Borderline ECG", with no abnormal reading at all, so the dataset supports
    almost no supervised target. The two annotation sources disagree
    systematically rather than randomly: SL12 returns a normal or
    otherwise-normal verdict for 13 records against the cardiologist's 26, and
    flags 4 athletes with a critical ACUTE MI/STEMI alert that the cardiologist
    reads as normal or borderline. That asymmetry is the dataset's subject, not
    noise in it — treating the SL12 output as ground truth inverts the finding.
    Waveform amplitudes are per-lead min-max normalised, which removes absolute
    and inter-lead voltage information entirely.
  rai_personal_sensitive_info: >
    De-identified. Records are numbered ath_001 to ath_028 and carry no dates,
    identifiers or per-record demographics — age, sex and sport are published
    only as cohort aggregates, so they cannot be joined to a record. Note that
    the cohort is nonetheless a small, named, elite population in one country,
    which limits how anonymous a specific ECG in it can be.
