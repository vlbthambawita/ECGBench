# ECGBench Config: ECG Effects of Dofetilide, Moxifloxacin and Combinations
# =========================================================================
# https://physionet.org/content/ecgdmmld/1.0.0/
#
# 4,211 ten-second 12-lead ECGs at 1 kHz from 22 healthy volunteers in a
# randomised, double-blind, 5-period crossover Phase I trial (SCR-003,
# NCT02308748) run by the US FDA to test whether blocking **late sodium current**
# shortens the QT prolongation caused by a pure hERG blocker. Every subject passed
# through all five arms in a randomised order: dofetilide alone (the hERG
# positive control), dofetilide with mexiletine, dofetilide with lidocaine,
# moxifloxacin with diltiazem, and placebo.
#
# Like `ecgcipa`, this is a **pharmacology dataset, not a diagnosis dataset**.
# Nobody in it has a cardiac condition; what varies across records is the drug, the
# time since dosing and the resulting change in repolarisation. There is no rhythm
# or morphology class to predict, so stratification uses the treatment arm.
#
# SIX THINGS THAT ARE NOT LIKE THE OTHER 12-LEAD DATASETS HERE
#
# 1. `treatment` NAMES THE PERIOD'S REGIMEN, NOT THE DRUG ON BOARD. This is the
#    trap that matters most, because it makes the stratification label wrong as a
#    training target for roughly a third of the records. Within a period the drugs
#    were staged hours apart: in the "Mexiletine + Dofetilide" arm, mexiletine
#    alone is circulating at the 1.5-3 h timepoints (dofetilide plasma is NA) and
#    dofetilide only joins it from 6.5 h; in "Moxifloxacin + Diltiazem",
#    moxifloxacin runs alone until diltiazem appears at 12 h. A record labelled
#    "Mexiletine + Dofetilide" at TPT=2.0 is a mexiletine-only ECG. Use the six
#    plasma concentration columns for what was actually present; `treatment` is a
#    randomisation arm.
# 2. Every record ships TWICE, and only one copy is the ECG. `raw/<subject>/<uuid>`
#    is the 10 s 12-lead acquisition and is what this config points at.
#    `medians/<subject>/<uuid>` is a *derived* representative median beat — 16
#    channels (the 12 leads plus the vector-magnitude lead VCGMAG and the Frank
#    vx, vy, vz components), 1,200 samples, same 1 kHz — carrying the `.atr`
#    fiducial annotations. Same record id, same acquisition, different object. The
#    median beats get no fold of their own (that would be a second ECGBench
#    partition of the same recordings); the label loader exposes their paths and
#    fiducials instead.
# 3. Records come in TRIPLICATE. Three 10 s segments were extracted per
#    (subject, period, nominal timepoint) for 1,403 of the 1,404 timepoint groups —
#    4,211 = 1,403 x 3 + 2 — seconds apart, from the same subject in the same
#    posture at the same drug concentration. They are near-duplicates. Patient
#    grouping keeps all three on one side of the split; nothing else would.
# 4. 1000 Hz, and the samples really are MILLIVOLTS — unlike `ecgcipa`, whose
#    sibling headers are in microvolts. Every channel of every record declares its
#    own gain against unit `/mV` (per-lead AND per-record, e.g.
#    `330979.8(-11915)/mV` for lead I and `33780.4(-16215)/mV` for lead II of the
#    same record), each fitted to that channel's range. `wfdb.rdrecord` applies
#    them, so signal_unit_scale is 1.0. Verified: peak amplitudes then land at
#    1-4 mV. The ECGs were acquired at 500 Hz with 2.5 uV resolution and
#    **up-sampled to 1000 Hz** by the depositors, so the 1 kHz here is
#    interpolated, not measured.
# 5. Lead order is standard and spelled with an UPPERCASE A: I, II, III, AVR, AVL,
#    AVF, V1-V6 — PTB-XL's spelling, and the opposite of `ecgcipa`, whose raw
#    headers write aVR/aVL/aVF. Matching in ECGDataset(leads=...) is
#    case-insensitive, so either works; lead_names records what the files say.
#    Here the medians/ headers agree with raw/ (both uppercase), which is also
#    unlike ecgcipa, where the two directories disagree.
# 6. The shipped metadata table has no signal-path column. SCR-003.Clinical.Data.csv
#    is otherwise ideal — one row per record, 33 columns, EGREFID equal to the
#    filename — but nothing in it says where the file is. The path is
#    `raw/<RANDID>/<EGREFID>`, verified for all 4,211 records against the raw/
#    directory tree, and ECGDMMLDSplitter writes `ecgbench_metadata.csv` carrying
#    it on first run. The dataset root must therefore be writable.
#
# AND THREE DEFECTS IN THE RELEASE ITSELF
#
#   All three survive the release's own SHA256SUMS.txt (all 21,059 files match), so
#   they are upstream properties and not download damage.
#
#   a. TPEAKTPEAKP IS EMPTY IN ALL 4,211 ROWS. The column is documented
#      ("Interval between the two peaks of the T-wave (if secondary peak is
#      present)") and it is 100% NA. Consistently, no `.atr` file anywhere in the
#      release carries a second T-peak mark, though the PhysioNet page lists
#      "secondary T peak (if present)" among the annotations. There is no secondary
#      T-peak information in this dataset at all.
#   b. 3 MEDIAN-BEAT HEADERS ARE CORRUPT and raise `IndexError` from
#      `wfdb.rdrecord`. In each, one channel's `.dat` filename has digits from the
#      gain field spliced into it — e.g. `...FFDFD3526620008.dat` for `vy` where the
#      file is `...FFDFD3526628.dat`, alongside gain `62000`. The `.dat` files are
#      intact (38,400 bytes, the right size) and the `.atr` files read fine; only
#      the header text is wrong. 4,208 of 4,211 median beats load. The affected
#      records are listed in ecgbench/labels/ecgdmmld.py. Their raw/ records are
#      unaffected, so this costs the split nothing.
#   c. 9 RECORDS HAVE NO QRS-OFFSET ANNOTATION, so `QRS` and `JTPEAK` are NA for
#      them and their `.atr` carries 4 marks instead of 5. Everything else is
#      complete: PR, QT and TPEAKTEND are present for all 4,211.
#
# ONE MORE THING WORTH KNOWING BEFORE YOU LOOK FOR THE ENDPOINT
#
#   The release ships no heart rate, no QTcF and no J-Tpeakc — only the absolute
#   intervals. HR and QTcF are derived by the label loader (60000/RR and
#   Fridericia); J-Tpeakc deliberately is not, because it needs the study's own
#   rate-correction exponent rather than a standard formula.
#
#   The study's endpoint is *change* from baseline, and unlike `ecgcipa` — where the
#   change columns exist only on unjoinable triplicate-average rows — here it is
#   fully computable per record. `BASELINE=Y` flags the three pre-dose (TPT=-0.5)
#   records of each of the 101 (subject, period) pairs, so the baseline is their
#   mean; `load_baseline_deltas()` does exactly that. Placebo-correction still needs
#   a cross-subject aggregation and is left to the user.

name: "ECG Effects of Dofetilide, Moxifloxacin and Combinations (ECGDMMLD)"
slug: "ecgdmmld"
version: "1.0.0"
url: "https://physionet.org/content/ecgdmmld/1.0.0/"
# The 1.1 GB release is genuinely public — no PhysioNet credentials needed:
#   wget -r -N -c -np https://physionet.org/files/ecgdmmld/1.0.0/
# It stays null because `metadata_csv` below is generated by the splitter on first
# run, and `download_dataset` raises if it cannot find that file immediately after
# extraction.
download_url: null
license: "ODC-By 1.0 (Open Data Commons Attribution License)"
description: >
  4,211 ten-second 12-lead ECGs at 1 kHz (up-sampled from a 500 Hz acquisition)
  from 22 healthy volunteers in a randomised, double-blind, placebo-controlled
  5-period crossover Phase I trial (study SCR-003, ClinicalTrials.gov
  NCT02308748) run by the US FDA to test whether blocking late sodium current can
  shorten the QT prolongation produced by a selective hERG blocker. Every subject
  passed through all five arms in one of ten randomised sequences: dofetilide
  alone, dofetilide with mexiletine, dofetilide with lidocaine, moxifloxacin with
  diltiazem, and placebo. Within each period the drugs were staged hours apart, so
  the late-sodium or calcium blocker circulates alone before the hERG blocker
  joins it. Triplicate 10 s segments were extracted at 14 nominal timepoints from
  half an hour before dosing to 24 hours after, each paired with a plasma
  concentration sample, and each is published both as the raw 10 s segment and as
  a derived 16-channel median beat carrying semi-automatic P-onset, QRS-onset,
  QRS-offset, T-peak and T-offset annotations on the vector-magnitude lead.
  Per-record RR, PR, QT, QRS, J-Tpeak, Tpeak-Tend, early and late repolarisation
  durations and three T-wave morphology scores accompany the waveforms, alongside
  subject demographics. No participant had cardiac disease: the label of interest
  is drug exposure, not diagnosis.
citation: >
  Johannesen L, Vicente J, Mason JW, et al. (2016). Late sodium current block for
  drug-induced long QT syndrome: results from a prospective clinical trial.
  Clinical Pharmacology & Therapeutics 99(2):214-223.
  https://doi.org/10.1002/cpt.205 — data: PhysioNet,
  https://doi.org/10.13026/C2D016
doi: "10.13026/C2D016"

creators:
  - type: Person
    name: "Lars Johannesen"
    url: "https://physionet.org/content/ecgdmmld/1.0.0/"
  - type: Person
    name: "Jose Vicente"
    url: "https://physionet.org/content/ecgdmmld/1.0.0/"
  - type: Person
