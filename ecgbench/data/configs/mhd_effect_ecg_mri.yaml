# ECGBench Config: MHD Effect on 12-Lead and 3-Lead ECGs in MRI Scanners
# ======================================================================
# https://physionet.org/content/mhd-effect-ecg-mri/1.0.0/
#
# ECGs recorded inside 1T, 3T and 7T MRI scanners, where the magnetohydrodynamic
# (MHD) effect — blood ions moving through a strong static field — superimposes a
# large voltage on the ECG and makes P waves, ST segments and T waves
# uninterpretable. Reference recordings taken outside the scanner give the
# undistorted ECG for most subjects. The dataset exists to develop ECG/MHD
# separation algorithms, so **the distortion is the signal of interest, not an
# artefact to filter out at validation time**.
#
# All 163 shipped files match the release's own SHA256SUMS.txt, so everything
# below is an upstream property rather than download damage.
#
# FOUR THINGS THAT DIFFER FROM WHAT THE RELEASE SAYS ABOUT ITSELF
#
# 1. There are 53 records, not 43. The README, the PhysioNet page and the CinC
#    paper all say 43 records / 23 subjects / 203 min; RECORDS lists 53 and 53
#    exist, totalling 226.6 min. The release grew after the paper and the prose
#    was never updated. Every figure ECGBench reports is recomputed from the files.
# 2. Subject numbers are per-scanner, NOT global — so they cannot be used as a
#    patient ID. ECGMRI1T01 is Male/27y/75kg/190cm while ECGMRI3T01 is
#    Female/29y/60kg/165cm. See patient_id_column below.
# 3. No record is a breath-hold recording. The README says breath-hold protocols
#    "are noted in the header files"; all 53 headers say "Spontaneous respiration".
# 4. Two records contradict themselves or their filename:
#      - ECGMRI3T01Hf  filename says head-first, its header says "Feet first (Ff)"
#      - ECGMRI1T01Out position "Outside the scanner" but field strength "1T" and
#                      B0 "Vertical", where the other 9 reference records say
#                      "Outside the scanner" for all three
#    Both raw header values and the filename-derived values are exposed, plus a
#    flag for the disagreement — ECGBench does not silently pick a winner.
#
# AND THREE STRUCTURAL FACTS
#
#   a. Records are NOT all 12-lead: 39 carry the diagnostic 12 leads on a Getemed
#      CM 3000 Holter, 14 carry only I, II, III ("Reduced Einthoven Triangle") on
#      an MRI-conditional MIPM Tesla M3 monitor. Only channels 0-2 are the same
#      channel in every record. See lead_names.
#   b. Length varies 24.4 s to 722.7 s, so expected_samples is deliberately empty
#      and window= is how you batch.
#   c. Amplitudes reach -31.1 to +19.9 mV, far past both devices' nominal input
#      ranges (+/-6 mV and +/-2.4 mV). That is the MHD effect plus baseline
#      offset, not corruption. See amplitude_range_mv.

name: "MHD Effect on 12-Lead and 3-Lead ECGs in MRI Scanners"
slug: "mhd_effect_ecg_mri"
version: "1.0.0"
url: "https://physionet.org/content/mhd-effect-ecg-mri/1.0.0/"
# The 265 MB zip is genuinely public — no PhysioNet credentials needed:
#   wget https://physionet.org/static/published-projects/mhd-effect-ecg-mri/mhd-effect-on-12-lead-ecgs-in-mri-scanners-1.0.0.zip
# Left null because metadata_csv below is generated by the splitter on first run,
# and download_dataset raises if it cannot find that file straight after
# extraction. Note the archive expands to a directory named after the full title
# ("influence-of-the-mhd-effect-on-12-lead-and-3-lead-ecgs-...-1.0.0"), not the
# short project slug.
download_url: null
license: "ODC-By 1.0 (Open Data Commons Attribution License)"
description: >
  53 ECG records from 26 healthy volunteers, acquired in 1T, 3T and 7T MRI
  scanners at Otto-von-Guericke University Magdeburg between 2011 and 2017, all
  at 1024 Hz. Inside the bore the magnetohydrodynamic effect — induced by blood
  flowing through the static B0 field — superimposes a voltage large enough to
  obscure the P wave, ST segment and T wave, which is what makes ECG-based
  patient monitoring and gating hard during MRI exams. Recordings were made
  without imaging, so no switched gradient or RF fields contribute and the
  distortion is MHD alone. 10 records are reference ECGs taken outside the
  scanner for the same subjects, standing in for the unobtainable in-bore ground
  truth. 39 records are diagnostic 12-lead on a Getemed CM 3000 Holter; 14 are
  3-lead (I, II, III) on an MRI-conditional MIPM Tesla M3 monitor. Every QRS
  complex was manually annotated by physicians or ECG experts — 14,950 in total,
  with no distinction between normal and ectopic beats — and no subject had a
  known cardiac disease. The 1T scanner was an open-bore Philips Panorama HFO
  whose B0 is *vertical* (back to chest) rather than horizontal, so its records
  were made prone and supine to invert the MHD effect; every other scanner is
  horizontal-B0 and was used head-first and feet-first, supine.
citation: >
  Krug Passand, J. W. (2021). Influence of the MHD effect on 12-lead and 3-lead
  ECGs recorded in 1T to 7T MRI scanners (version 1.0.0). PhysioNet.
  https://doi.org/10.13026/05td-jn37 — and cite the accompanying paper: J. Krug
  et al., A Database of Electrocardiogram Signals Acquired in Different Magnetic
  Resonance Imaging Scanners, Proc. Computing in Cardiology 44 (2017).
doi: "10.13026/05td-jn37"

creators:
  - type: Person
    name: "Johannes W. Krug Passand"
    url: "https://physionet.org/content/mhd-effect-ecg-mri/1.0.0/"
  - type: Organization
    name: "Otto-von-Guericke University Magdeburg"
    url: "https://www.ovgu.de/en/"

# --- Signal Properties ---
signal_format: "wfdb"
# Every channel declares its own gain and baseline in /mV — and they differ per
# channel AND per record (lead I runs 5318/mV in ECGMRI7T01Ff against 14590/mV in
# ECGMRI1T01Sup, with baselines from -50290 to +168551). wfdb applies both, so
# p_signal is already millivolts and no extra scaling is wanted.
signal_unit_scale: 1.0

# leads/lead_names describe the DIAGNOSTIC 12-LEAD layout, which 39 of 53 records
# use. The other 14 hold only 3 channels — I, II, III — from the MRI-conditional
# monitor. Exactly two layouts ship, and they agree on channels 0-2:
#
#   I II III aVR aVL aVF V1 V2 V3 V4 V5 V6    39 records  (Getemed CM 3000, 12 bit)
#   I II III                                  14 records  (MIPM Tesla M3, 24 bit)
#
# So ECGDataset(leads=["I"]) / ["II"] / ["III"] resolves on every record, while
# anything past III raises on the 14 three-lead records, naming the record and its
# true channel count. Filter first if you want a homogeneous batch — the label
# loader exposes lead_config, n_signals and channel_names for exactly that. Without
# a leads= filter a batch mixes (12, N) and (3, N) tensors, which ecg_collate_fn
# handles but a model will not.
leads: 12
lead_names: ["I", "II", "III", "aVR", "aVL", "aVF",
             "V1", "V2", "V3", "V4", "V5", "V6"]

# Nominal only: the median record. Lengths are NOT uniform — 25,000 samples
# (24.4 s, ECGMRI3T02Ff and ECGMRI3T02Out) to 740,001 (722.7 s, ~12 min).
duration_seconds: 191.9
sampling_rates: [1024]
default_sampling_rate: 1024

# --- File Structure ---
# The release ships no metadata table — just 53 .dat/.hea/.qrs triples plus
# README, RECORDS, ANNOTATORS, LICENSE.txt and SHA256SUMS.txt. All per-record
# metadata lives in the .hea comment block: scanner make, field strength, B0
# orientation, ECG hardware, and the subject's sex, age, weight and height.
# MHDEffectECGMRISplitter writes this normalised CSV on first run, because
# validate_dataset re-reads metadata_csv from disk rather than reusing the
# splitter's frame. The dataset root must be writable.
metadata_csv: "ecgbench_metadata.csv"
metadata_csv_separator: ","
record_id_column: "record_name"

# NOT the filename's subject number — that is scoped per scanner, so ECGMRI1T01
# (Male/27y/75kg/190cm) and ECGMRI3T01 (Female/29y/60kg/165cm) are different
# people. The release ships no subject ID at all, so the label loader derives
# `subject_key` from the one identifying information the headers do carry: the
# sex/age/weight/height tuple. That collapses the 29 filename subject-slots to 26
# people and, crucially, reunites the three cross-scanner duplicates —
# 3T01 == 7T04, and 1T01 == 3T02 == 7T05 — which a filename-based key would have
# scattered across folds. In a dataset whose whole purpose is comparing one
# subject's ECG at different field strengths, that would be textbook leakage.
# Read the caveats on `subject_key` in ecgbench/labels/mhd_effect_ecg_mri.py
# before relying on it: it can over-merge, and the release's own "23 subjects"
# is not reproducible from the files by any rule.
patient_id_column: "subject_key"

signal_path_columns:
  1024: "signal_path"  # bare record stem, e.g. ECGMRI3T04Ff

# --- Labels ---
# There is no diagnosis to predict here: every subject was healthy and the only
# annotations are QRS positions. The "label" is the acquisition condition.
label_column: "condition"
label_format: "single"

stratification:
  # Custom: the splitter takes `condition` from the label loader — reference /
  # 1T / 3T / 7T, derived from the filename rather than the self-contradicting
  # header field-strength string. This is the dataset's independent variable, so
  # it is what folds should balance. Note groups are subjects and a subject can
  # span conditions (1T01 == 3T02 == 7T05 contributes to three), so
  # stratification is necessarily approximate.
  method: "custom_function"

# --- Predefined Splits ---
has_predefined_splits: false

# --- Quality Validation ---
validation:
  # Declared for the 12-lead majority. Nothing reads it — see the ADD_DATASET_TODO
  # gotcha — so it does not mis-flag the 14 three-lead records.
  expected_leads: 12
  # Deliberately EMPTY. Record length genuinely varies by a factor of 30 (25,000
  # to 740,001 samples), and check_truncated_signal returns [] when the rate has
  # no entry, which is the intended way to disable a check that cannot apply.
  # Adding a 1024 key would fail every record shorter than it.
  expected_samples: {}
  checks:
    - missing_leads
    - nan_values
    - truncated_signal
    - flat_line
    - corrupt_header
    - amplitude_outlier
  # Far wider than the usual +/-10 mV, and that is the whole point of this
  # dataset. Measured extremes across all 53 records are -31.05 mV
  # (ECGMRI3T17Ff) to +19.91 mV (ECGMRI7T04Hf); 32 records exceed +/-6 mV and 16
  # exceed +/-10. Those excursions are the MHD effect plus per-channel baseline
  # offset — real recordings of the phenomenon under study. A +/-10 range would
  # exclude 16 of 53 records from clean/ for being exactly what they are meant to
  # be. +/-35 passes all 53 while still catching a decoding error in a future
  # release.
  amplitude_range_mv: [-35.0, 35.0]

# --- Labels ---
# Module-based: ecgbench/labels/mhd_effect_ecg_mri.py parses the .hea comment
# block and counts the .qrs annotations. source_csv is null because the labels
# live in the header and annotation files themselves, so load_labels() works on a
# fresh copy with no prior `ecgbench splits` run.
labels:
  source_csv: null
  join_column: "record_name"

# --- Croissant Metadata ---
croissant:
  keywords:
    - "ECG"
    - "electrocardiography"
    - "MRI"
    - "magnetohydrodynamic effect"
    - "MHD"
    - "cardiac MRI"
    - "patient monitoring"
    - "signal separation"
    - "QRS detection"
    - "12-lead"
    - "3-lead"
    - "PhysioNet"
  rai_data_collection: >
    Recorded at Otto-von-Guericke University Magdeburg between 2011 and 2017 from
    26 healthy volunteers with no known cardiac disease, inside 1T, 3T and 7T MRI
    scanners (Philips Panorama HFO, Philips Achiva, Siemens Magnetom Skyra,
    Siemens Magnetom 7T) at 1024 Hz. Imaging was not running, so neither switched
    gradients nor RF fields contribute and the only distortion is the
    magnetohydrodynamic effect from the static B0 field. Two ECG devices were
    used: a Getemed CM 3000 12-lead Holter (12 bit, +/-6 mV) for 39 records and an
    MRI-conditional MIPM Tesla M3 3-lead patient monitor (24 bit, +/-2.4 mV) for
    14. Reference ECGs were acquired outside the scanner for 7 of the subjects,
    standing in for the in-bore ground truth that cannot be measured. Physicians
    or ECG experts manually annotated all 14,950 QRS complexes.
  rai_data_biases: >
    53 records from 26 people is far too few to train on, and the cohort is
    narrow and unrepresentative of any clinical population: healthy volunteers,
    18-30 years old, 20 of 26 male, all recruited at one German university. Every
    subject was free of known cardiac disease and the QRS annotations make no
    normal/ectopic distinction, so the dataset supports no diagnostic target at
    all — it is a signal-processing benchmark, not a classification one. Coverage
    across the independent variable is very uneven: 31 records at 3T against 10
    at 7T and just 2 at 1T from a single subject, so any per-field-strength
    conclusion about the 1T open scanner rests on one person. Only 7 of the 26
    subjects have a reference recording outside the scanner, and those references
    are a stationarity assumption rather than a simultaneous ground truth —
    heart rate and morphology genuinely differ between the two acquisitions. The
    3-lead subset is confined to 3T and carries no precordial leads, so lead
    configuration is confounded with field strength.
  rai_personal_sensitive_info: >
    De-identified: records are named by scanner field strength, a per-scanner
    subject number and body position, with no dates or direct identifiers. The
    headers do carry each subject's sex, age, weight and height, and ECGBench
    uses that tuple as the patient grouping key precisely because it is
    identifying enough to distinguish individuals — which is also the reason it
    should be treated as quasi-identifying. The cohort is small and drawn from one
    institution, so re-identification risk is not zero despite the absence of
    names or dates.
