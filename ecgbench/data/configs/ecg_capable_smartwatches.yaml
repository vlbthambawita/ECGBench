# ECGBench Config: Electrocardiogram-Capable Smartwatches
# =======================================================
# https://physionet.org/content/ecg-capable-smartwatches/1.0.0/
#
# 915 recordings of a METRON PS-440 patient simulator, taken simultaneously by a
# reference 12-lead hospital electrocardiograph (Philips TC30) and by four consumer
# smartwatches — Apple Watch Series 9, Samsung Galaxy Watch 6, Fitbit Sense 2 and
# Withings ScanWatch — under the IEC 60601-2-25:2011 accuracy protocol. It is the
# only dataset in ECGBench with NO HUMAN SUBJECT AT ALL: the release's Ethics
# section reads "Data collected from synthetic sources", and the ground truth is
# not a diagnosis but the knob the simulator was set to.
#
# 36 simulator settings in four families, each recorded five times on each of the
# five devices: heart rate 30-300 bpm (15 settings), R-wave amplitude 500-2000 µV
# (4), ST-segment offset -800 to +800 µV in 100 µV steps (16), and a 2 Hz square
# wave (1). The labels are those nominal values; measuring how far each device
# departs from them is the question the release exists to answer, so nothing here
# estimates them from the signal on a user's behalf.
#
# ALL 1,833 SHIPPED FILES VERIFY against the release's own SHA256SUMS.txt, so
# everything below is an upstream property rather than download damage.
#
# NINE THINGS TO KNOW BEFORE USING IT, all verified against the files.
#
# 1. THE SMARTWATCH RECORDS ARE LEAD I AND THEIR HEADERS SAY "II". The Methods
#    state that the simulator's R output (right arm) went to the watch crown and
#    its L output (left arm) to the caseback, and that the watches' own exports are
#    "formatted as single-lead (Lead I) electrocardiograms". LA minus RA is lead I.
#    All 720 smartwatch headers nonetheless name the channel "II". lead_names below
#    follows the FILES, because that is what leads= resolves against — so
#    ECGDataset(leads=["II"]) returns the Philips' genuine lead II for 195 records
#    and an arm-to-arm lead I for the other 720, with no error. The labels'
#    `derivation` column exists to make that filterable. This is the one thing in
#    this dataset that can silently corrupt a cross-device comparison.
#
# 2. THE REFERENCE DEVICE IS 12-LEAD; ONLY THE WATCHES ARE SINGLE-LEAD. 195 Philips
#    records store 12 channels, the other 720 store one, so leads: 1 below is the
#    PREDOMINANT layout and the 12-lead one is declared in alternate_lead_names.
#    A dataset mixing 1- and 12-lead records cannot be batched without leads=; see
#    the zzu_pecg note in CLAUDE.md, which is the same problem.
#
# 3. EVERY SAMSUNG RECORD ENDS IN AN INVALID SAMPLE, SO `clean` CONTAINS NO SAMSUNG
#    RECORD AT ALL. All 179 Samsung records are 15,001 samples where 15,000 is
#    30.000 s at 500 Hz, and that extra final sample is digital -32768 — WFDB's
#    invalid-sample marker for format 16 — which wfdb returns as NaN.
#    check_nan_values has no threshold, so all 179 fail it and `clean` holds 736
#    records from four devices. The signal before it is intact: window=(0, 15000)
#    reads a Samsung record with no NaN. Nothing else in the release contains one.
#    This is the sddb situation one format up (see the memory of format-212 -2048).
#
# 4. "ALL EXPERIMENTS IN QUINTUPLICATE" IS FALSE FOR 20 RECORDS. 36 settings x 5
#    devices x 5 repetitions is 900; the release ships 915. Seventeen settings have
#    a SIXTH repetition — every Philips freq_test setting, plus Fitbit's f80 and
#    ST-m6 — and two have only FOUR: Samsung's st-p8 and Fitbit's ST-p8. No two
#    records in the release hold an identical signal, so the sixth repetitions are
#    genuine acquisitions and are kept; `is_extra_replicate` flags them.
#
# 5. FITBIT SPELLS ITS ST DIRECTORIES IN UPPERCASE, AND EVERY FITBIT HEADER NAMES
#    THE WRONG DEVICE. Fitbit stores st-segment/ST-m1/ST-m1_0 where the other four
#    devices store st-segment/st-m1/st-m1_0, so a setting key taken verbatim would
#    describe 32 ST conditions instead of 16 and put one simulator condition in two
#    different folds. `setting_id` is lowercased for exactly that reason.
#    Separately, all 181 Fitbit headers carry the comment "Withings Scanwatch
#    reading METRON PS-440 patient simulator" — a copy-paste error; the records are
#    250 Hz against Withings' 300 Hz and share no signal with them.
#
# 6. `RECORDS` NAMES 75 FILES THAT DO NOT EXIST. The shipped index lists Withings'
#    freq_test records under "WithingsScanwatch/" while the directory is
#    "withingsscanwatch/", so 75 of its 915 lines resolve to nothing on a
#    case-sensitive filesystem and building paths from it produces 75 records that
#    all fail corrupt_header. The splitter enumerates headers from disk and reports
#    the case-only mismatches as such.
#
# 7. THE APPLE DIRECTORY SAYS SERIES 8 AND THE RELEASE SAYS SERIES 9. The abstract
#    and the Data Description both name the Apple Watch Series 9, and the latter
#    maps "applewatch_serie8" to it explicitly; the directory and all 180 header
#    comments say "Serie 8". `device` keeps the directory name so paths stay
#    traceable and `device_model` carries the release's prose answer.
#
# 8. EVERY RECORD WAS RESCALED TO FILL INT16, SO THE HEADER GAIN IS PER RECORD.
#    914 of 915 reach digital +32767 and the same number reach -32767 or -32768;
#    gains run 15,082 to 207,386 adu/mV and differ record by record. Physical
#    millivolts come back correctly from wfdb — signal_unit_scale stays 1.0 — but
#    16-bit resolution is a per-record quantity, and a record sitting at the rail
#    is NOT clipping: that is where its own extremes were mapped. The single
#    exception is withingsscanwatch/st-segment/st-p1/st-p1_1, whose maximum code
#    is 32,766.
#
# 9. LENGTH AND RATE BOTH VARY BY DEVICE, so a window in samples is not a window in
#    time. Philips 5,500 at 500 Hz (11.0 s — not the 10 s the Methods state), Apple
#    15,360 at 512 Hz except amp1000_0 at 13,968, Samsung 15,001 at 500 Hz, Fitbit
#    7,500 at 250 Hz, Withings 9,000 at 300 Hz except six freq_test records at
#    8,999. expected_samples is therefore empty, and window=(0, 5500) — 11.0 s of
#    Philips, 22.0 s of Fitbit — is the largest window that fits every record.
#
# THE SPLIT GROUPS ON THE SIMULATOR SETTING, NOT ON A PATIENT, because there is no
# patient. patient_id_column points at `setting_id` and is named for what it is.
# The five repetitions of a setting on one device correlate at a median of 0.95, and
# the same setting on a DIFFERENT device at 0.803 against a 0.953 self-control — the
# five instruments recorded the same simulator output simultaneously — so the group
# has to be the setting across all five devices. See the splitter module for the
# measurements and for the two groupings that were rejected.

name: "Electrocardiogram-Capable Smartwatches: Assessing Their Clinical Accuracy and Application"
slug: "ecg_capable_smartwatches"
version: "1.0.0"
url: "https://physionet.org/content/ecg-capable-smartwatches/1.0.0/"
# Null because the source is restricted-access AND because the splitter generates
# metadata_csv — either alone would be enough to require it.
download_url: null
license: "PhysioNet Restricted Health Data License 1.5.0"
description: >
  915 electrocardiograms of a METRON PS-440 patient simulator, recorded
  simultaneously by a Philips TC30 hospital electrocardiograph used as the clinical
  reference and by four ECG-capable consumer smartwatches — Apple Watch Series 9,
  Samsung Galaxy Watch 6, Fitbit Sense 2 and Withings ScanWatch — following the
  accuracy protocol of IEC 60601-2-25:2011. The simulator was stepped through 36
  calibrated settings in four families: heart rate from 30 to 300 bpm in 15 steps,
  R-wave amplitude at 500, 1000, 1500 and 2000 µV, ST-segment elevation and
  depression from -800 to +800 µV in 100 µV steps, and a 2 Hz square wave, each
  recorded five times on every device. The watches were held on an adjustable
  stand with the simulator's right-arm output wired to the crown and its left-arm
  output to the caseback, giving an arm-to-arm lead I; the electrocardiograph was
  connected with standard 12-lead cables and captured all twelve derivations.
  No person was recorded: every waveform is synthetic, which makes this the one
  release in ECGBench whose ground truth is an instrument setting known exactly
  rather than a clinical label, and therefore the natural place to measure what a
  wrist-worn device does to amplitude, rate and ST morphology.
