# ECGBench Config: MedalCare-XL (synthetic 12-lead ECGs from simulations)
# ==============================================================================
# 16,842 synthetic 12-lead ECGs generated by multi-scale electrophysiological
# simulation — atrial and ventricular models run independently, then composed into
# 10 s rhythms and projected onto a torso model.
# https://doi.org/10.5281/zenodo.8068944
#
# THERE ARE NO PATIENTS. Every record is a simulation, so nothing here is derived
# from a human recording and there is no consent, de-identification or
# demographic-bias question of the usual kind. `patient_id_column` below points at
# the ventricular simulation model, which is the grouping unit that plays the role
# a patient plays elsewhere.
#
# READ THIS BEFORE USING THE SIGNALS — FOUR NON-OBVIOUS PROPERTIES.
#
# 1. `signal_format` IS `csv_lead_rows`, NOT `csv`. These CSVs are 12 rows x 5000
#    columns with NO header row — one row per lead, samples running along the row.
#    That is the transpose of every other CSV dataset here (`chapman_shaoxing`,
#    `ningbo_iva`), which store samples in rows under a header naming the leads.
#    Loading one with the plain `csv` reader yields a (5000, 11) array of garbage
#    rather than an error, which is why this needed its own format rather than a
#    flag.
#
# 2. EACH RECORD SHIPS IN THREE RENDERINGS AND THIS CONFIG PICKS ONE.
#    `<n>_raw.csv` is the noise-free simulator output, `<n>_noise.csv` adds
#    superimposed noise, `<n>_filtered.csv` then applies the release's 0.5-150 Hz
#    order-3 Butterworth pair. `signal_path` points at **filtered**, the closest of
#    the three to a recorded ECG. The other two are one string substitution away and
#    the generated metadata CSV carries both as `signal_path_raw` and
#    `signal_path_noise`; `ecgbench/labels/medalcare_xl.py` exposes them too. They
#    are one record in three renderings, not three records — do not concatenate
#    them, and do not treat a raw/filtered pair as two samples.
#
# 3. THE AUTHORS' OWN SPLIT IS USED VERBATIM, AND ITS GUARANTEE HAS ONE HOLE.
#    The release README states that ECGs sharing a ventricular simulation model
#    appear in only one of train/validation/test. That holds **within** each
#    pathology and fails **across** them: model S64 is the test-side model for
#    sinus, avblock, lbbb, rbbb and every MI subclass, and simultaneously a
#    train-side model for fam, iab and lae; S67 is likewise validation-side for the
#    former group and train-side for the latter. Checked at the parameter level —
#    `sinus/test/run_S64` and `fam/train/run_S64` agree on all 84 ventricular
#    parameters that are constant within a run directory, so this is one model, not
#    a name collision.
#
#    NO RECORDS ARE SHARED, though, so this is not duplicate-record leakage: no two
#    records anywhere in those two directories have the same full ventricular
#    parameter vector (0 of 100 x 130), and a waveform check over the same pair
#    found the nearest cross-directory QRS-window distance at 1.13 against a
#    within-directory median of 3.78, with exact-duplicate sensitivity confirmed at
#    distance 0.0 on a self-match. What it does mean is that anyone training a
#    classifier that spans the atrial (fam/iab/lae) and ventricular (the rest)
#    pathology arms has the same ventricular anatomy on both sides of the split.
#    `model_id` is exported in every fold CSV so this is checkable, and regroupable,
#    by hand.
#
# 4. `mi/examples/` IS NOT DATA. Six files there illustrate the MI subclasses and
#    sit outside the `<split>/run_<model>/` layout; they are excluded, which is why
#    this config reports 16,842 records where a naive count of `*_raw.csv` finds
#    16,848. Both parameter-file trees hold exactly 16,842 entries and agree.
#
# COUNTS: 16,842 RECORDS, NOT THE 16,900 OF THE TITLE. The Zenodo title and the
# paper title both say 16,900. What ships in v1.3 is 16,842 — recomputed three
# independent ways (16,848 `*_raw.csv` minus the 6 `mi/examples` illustrations;
# 16,842 `*_AtrialParameters.txt`; 16,842 `*_VentricularParameters.txt`). The
# shortfall is concentrated in iab, where 13 of the 186 run directories have gaps
# in their numbering — `iab/train/run_S66` holds 107 files numbered up to 000130.
# No changelog ships to explain it. Records are enumerated from the files that
# exist, never from a range.
#
# CHECKSUM VERIFIED. `MedalCare-XL.zip` md5 is 96497fcbc5c443bec1280f2033836776,
# matching Zenodo's published value, and the extracted tree is an exact
# bidirectional match with the archive listing (84,416 files, 0 missing, 0 extra).

name: "MedalCare-XL (Synthetic 12-Lead ECGs from Simulations)"
slug: "medalcare_xl"
# Zenodo's own version string for the 2023-06-06 deposit.
version: "1.3"
url: "https://doi.org/10.5281/zenodo.8068944"
# Zenodo serves one 9.3 GB zip and a direct URL exists, but MedalCareXLSplitter
# generates `metadata_csv` by walking the extracted tree, so auto-download would
# leave the pipeline with no metadata. Pass --data-path.
download_url: null
license: "CC BY 4.0"
description: >
  16,842 synthetic 12-lead ECGs produced by multi-scale electrophysiological
  simulation rather than recorded from people. Atrial and ventricular models were
  run independently on 13 anatomical/electrophysiological model configurations,
  composed into 10 s rhythms at 500 Hz and projected onto torso models. Eight
  pathology classes ship — normal sinus rhythm, AV block, left and right bundle
  branch block, left atrial enlargement, fibrotic atrial cardiomyopathy,
  interatrial conduction block, and myocardial infarction, the last split into
  eight subclasses by occlusion site (LAD/LCX/RCA), transmurality (0.3 or 1.0) and,
  for LCX, anterior or posterior region. Every record ships three times: noise-free
  simulator output, the same with superimposed noise, and a 0.5-150 Hz filtered
  version. The full simulation parameter set — ion model, conductivities, action
  potential durations, stimulus sites, electrode positions, atrial geometry and
  torso — ships per record and is exposed through the label loader.
citation: >
  Gillette, K., Gsell, M.A.F., Nagel, C., Bender, J., Winkler, B., Williams, S.E.,
  Bar, M., Schaeffter, T., Dossel, O., Plank, G., Loewe, A. MedalCare-XL: 16,900
  healthy and pathological synthetic 12 lead ECGs obtained through
  electrophysiological simulations. Scientific Data 10, 531 (2023).
doi: "10.1038/s41597-023-02416-4"

creators:
  - type: Organization
    name: "Division of Biophysics, Medical University of Graz"
    url: "https://www.medunigraz.at/"
  - type: Organization
    name: "Institute of Biomedical Engineering, Karlsruhe Institute of Technology"
    url: "https://www.ibt.kit.edu/"
  - type: Organization
    name: "Physikalisch-Technische Bundesanstalt, Berlin"
    url: "https://www.ptb.de/"
  - type: Organization
    name: "University of Edinburgh"
    url: "https://www.ed.ac.uk/"

# --- Signal Properties ---
# 12 ROWS x 5000 COLUMNS, NO HEADER — see note 1 at the top of this file. Verified
# uniform across a 40-file random sample and enforced for all 16,842 by
# expected_samples below.
signal_format: "csv_lead_rows"
# The simulator writes millivolts directly: the largest absolute sample in a
# 40-record sample is 3.07 mV, and a QRS peaks around 1-2 mV. No conversion.
signal_unit_scale: 1.0
leads: 12
# Standard order, stated by the release README ("lead order: I, II, III, aVR, aVL,
# aVF, V1-V6") and consistent with the per-record parameter files, which give
# electrode positions for RA/LA/RL/LL and V1-V6 and nothing else.
lead_names: ["I", "II", "III", "aVR", "aVL", "aVF", "V1", "V2", "V3", "V4", "V5", "V6"]
duration_seconds: 10
sampling_rates: [500]
default_sampling_rate: 500

# --- File Structure ---
# The release ships NO metadata table — pathology, subclass, split and model are
# encoded in the directory path and nowhere else. MedalCareXLSplitter walks
# WP2_largeDataset_Noise/ into this file on first run, so the validation engine
# resolves the same paths the splitter does. The dataset root must be writable.
metadata_csv: "ecgbench_metadata.csv"
metadata_csv_separator: ","
record_id_column: "record_id"
# There are no patients. This is the ventricular simulation model (S62-S74, 13
# values) — the grouping unit the authors defined the split around, and the one
# whose reuse across pathology arms is worth being able to see. It is a real
# grouping, unlike a record id echoed into this field, so it is set rather than
# left null. Read note 3 at the top before assuming it is split-disjoint.
patient_id_column: "model_id"

signal_path_columns:
  500: "signal_path"  # WP2_largeDataset_Noise/sinus/train/run_S65/000001_filtered.csv

# --- Labels ---
# The 15-class label: the 7 non-MI pathologies plus the 8 MI subclasses. The
# coarser 8-class `pathology` is also in the metadata CSV and the label loader.
label_column: "pathology_subclass"
label_format: "single"

stratification:
  method: "direct"  # pathology_subclass is already one label per record

# --- Predefined Splits ---
# The release's own train/validation/test directories, taken verbatim. They are
# roughly 70/15/15 and were chosen so that ECGs sharing a ventricular simulation
# model stay within one split — see note 3 above for where that holds and where it
# does not. `--n-folds` has no effect on a predefined-split dataset.
has_predefined_splits: true
predefined_splits:
  column: "fold"
  fold_mapping:
    train: [1]
    val: [2]
    test: [3]

# --- Quality Validation ---
validation:
  expected_leads: 12
  expected_samples:
    500: 5000                     # 10 s x 500 Hz, uniform — simulator output
  checks:
    - missing_leads
    - nan_values
    - truncated_signal
    - flat_line
    - corrupt_header
    - amplitude_outlier
  # Simulated signals, so no electrode artefact or saturation rail to catch: this
  # is a guard against a units or transpose mistake, not a filter. The largest
  # absolute sample seen in sampling is 3.07 mV.
  amplitude_range_mv: [-10.0, 10.0]

# --- Labels ---
# Module-based: ecgbench/labels/medalcare_xl.py. The pathology labels come from the
# generated metadata CSV, so they only exist after `ecgbench splits` has run once
# against a writable dataset root. The simulation parameters come from the ~105
# key/value pairs in each record's *_VentricularParameters.txt and the ~21 in its
# *_AtrialParameters.txt, which are plain text and not a CSV a declarative block
# could read.
labels:
  source_csv: "ecgbench_metadata.csv"
  join_column: "record_id"

# --- Croissant Metadata ---
croissant:
  keywords:
    - "ECG"
    - "electrocardiography"
    - "synthetic data"
    - "in silico"
    - "electrophysiological simulation"
    - "cardiac modelling"
    - "myocardial infarction"
    - "bundle branch block"
    - "12-lead"
  rai_data_collection: >
    Not collected — generated. Atrial and ventricular electrophysiology were
    simulated independently with the Courtemanche and Mitchell-Schaeffer ionic
    models over anatomical meshes, using 13 ventricular model configurations and a
    set of atrial geometries, then composed into 10 s rhythms and projected onto
    torso models to give 12-lead surface ECGs at 500 Hz. Pathologies were induced
    by altering model parameters — conduction block, fibrosis, atrial enlargement,
    and ischaemic regions of two transmurality levels at three occlusion sites.
    Each ECG was released three times: noise-free, with superimposed noise, and
    band-pass filtered at 0.5-150 Hz. Every record's full parameter set ships
    alongside it. The authors defined the train/validation/test partition by
    ventricular simulation model so that ECGs from one model stay within one split.
  rai_data_biases: >
    This is simulator output, and its first bias is that it is not real: waveform
    morphology reflects the modelling assumptions — ionic model, mesh resolution,
    conductivity tensors, torso conductivities, electrode placement — rather than
    the variability of human recording, and no acquisition artefact, electrode
    misplacement, motion or device filtering is represented beyond the one noise
    model applied. Anatomical diversity is bounded by a small number of geometries
    and 13 ventricular model configurations, so records are far from independent:
    thousands of ECGs descend from one anatomy. Class balance is an authoring
    choice, not a prevalence — myocardial infarction is 46% of the release,
    spread over 8 subclasses, while each remaining pathology is 7-8%. The label is
    the simulated condition, so it is exact by construction and carries none of the
    reader disagreement or diagnostic uncertainty a clinically labelled dataset
    does; models validated only here will not have met either. No demographics
    exist, so a model cannot be audited for demographic fairness on this data at
    all. Note also that the same ventricular model appears on both sides of the
    predefined split for classifiers spanning the atrial and ventricular pathology
    arms.
  rai_personal_sensitive_info: >
    None. No record derives from a human recording — every signal is the output of
    an electrophysiological simulation, and the release carries no demographics, no
    dates, no identifiers and no clinical text. The anatomical meshes and torso
    models are the only human-derived inputs and are not redistributed here.
