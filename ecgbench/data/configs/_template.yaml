# ECGBench Dataset Configuration Template
# ========================================
# Copy this file to <your_dataset_slug>.yaml and fill in all fields.
# Fields marked [REQUIRED] must be provided. Others have defaults.

# --- Identity [REQUIRED] ---
name: ""                          # Human-readable name (e.g., "PTB-XL")
slug: ""                          # Lowercase identifier (e.g., "ptbxl") — must match filename
version: ""                       # Dataset version (e.g., "1.0.3")
url: ""                           # Official dataset URL
download_url: null                # Direct download URL for auto-download (zip/tar.gz). null if not available.
license: ""                       # License URL or SPDX identifier
description: ""                   # One-paragraph description
citation: ""                      # Short citation or BibTeX
doi: ""                           # Paper DOI

creators:
  - type: Organization            # "Organization" or "Person"
    name: ""
    url: null

# --- Signal Properties ---
signal_format: "wfdb"             # One of: wfdb, csv, csv_lead_rows, npy, hdf5
                                  #   csv           -> samples in rows, leads in
                                  #                    columns, with a header row
                                  #   csv_lead_rows -> the transpose: leads in rows,
                                  #                    samples in columns, no header
                                  # (edf/mat not implemented)
signal_unit_scale: 1.0            # Multiply raw samples by this to get millivolts.
                                  #   wfdb applies its own header gain -> leave at 1.0
                                  #   CSV/array data stored in microvolts -> 0.001
                                  # Get this wrong and amplitude_outlier fires on
                                  # every record (or never fires at all).
leads: 12                         # Number of ECG leads
lead_names: []                    # [REQUIRED for ECGDataset(leads=...)] Lead names in
                                  # the order the FILES store them, spelled as the source
                                  # spells them. Read one record and copy what you see —
                                  # do not assume the standard order. MIMIC-IV-ECG stores
                                  # aVF before aVL, and PTB-XL spells them AVR/AVL/AVF.
alternate_lead_names: {}          # Only if records DON'T all store the same leads.
                                  # Maps stored lead count -> lead order, e.g.
                                  #   9: ["I","II","III","AVR","AVL","AVF","V1","V3","V5"]
                                  # Almost always empty. zzu_pecg is the one case:
                                  # 1,856 of its records hold 9 leads instead of 12,
                                  # and the 9-lead layout is NOT a prefix of the
                                  # 12-lead one, so position 7 is V3 there and V2
                                  # here. Without this, leads=["V2"] silently returns
                                  # V3 for those records. With it, ECGDataset
                                  # re-resolves the requested names per record and
                                  # raises if a lead is absent from that layout.
record_lead_layouts: []           # The other half of that problem: records storing
                                  # the SAME number of leads under DIFFERENT names,
                                  # which a count-keyed map cannot express. List
                                  # every layout the release uses, e.g.
                                  #   - ["MLII", "V1"]
                                  #   - ["V5", "MLII"]
                                  # mitdb is the one case: all 48 records hold 2
                                  # leads, 8 of them not MLII/V1, and record 114
                                  # stores the two reversed. Declaring this makes
                                  # ECGDataset read each record's own header to
                                  # resolve leads=, and raise for a record whose
                                  # layout lacks a requested lead. wfdb only —
                                  # no other format names leads per record.
duration_seconds: 10              # Nominal recording duration in seconds
sampling_rates: [500]             # Available sampling rates in Hz
default_sampling_rate: 500        # Which rate to use by default

# --- File Structure [REQUIRED] ---
metadata_csv: ""                  # Path to main metadata CSV, relative to dataset root
metadata_csv_separator: ","
record_id_column: ""              # Column with unique record identifiers
patient_id_column: null           # Column with patient IDs (null if unavailable or one-record-per-patient)
zero_padded_identifiers: false    # Set true if ANY record id, patient id or signal
                                  # path is a zero-padded number ("00735"). pandas
                                  # reads a column of digits as int and strips the
                                  # zeros, after which record ids stop matching the
                                  # source and signal paths stop resolving. afdb is
                                  # the one dataset that needs it. Forgetting it is
                                  # caught: export_splits refuses to write a
                                  # zero-padded identifier while this is false.

signal_path_columns:              # Mapping: sampling_rate -> column_name containing signal file paths
  500: "filename_hr"              # Paths must be relative to dataset root

# --- Labels [REQUIRED] ---
label_column: ""                  # Column containing diagnostic labels
label_format: "single"            # One of: dict_string, single, comma_separated, json
#   dict_string  — Python dict literal as string, e.g. "{'NORM': 100.0, 'SR': 0.0}"
#   single       — single label value per row
#   comma_separated — "NORM,SR,AFIB"
#   json         — JSON string

stratification:
  method: "direct"                # One of: superclass_mapping, direct, custom_function
  #   direct            — use label_column values directly for stratification
  #   superclass_mapping — map fine-grained codes to superclasses via a mapping file
  #   custom_function    — requires a custom splitter strategy in Python
  mapping_source: null            # CSV file with code->superclass mapping (for superclass_mapping)
  superclass_column: null         # Column in mapping_source that has the superclass

# --- Predefined Splits ---
has_predefined_splits: false
predefined_splits:
  column: null                    # Column name containing fold/split assignments
  fold_mapping:                   # Map split names to fold values in that column
    train: []
    val: []
    test: []

# --- Quality Validation ---
validation:
  expected_leads: 12
  expected_samples:               # sampling_rate -> expected number of samples
    500: 5000
  checks:                         # Quality checks to run (see ecgbench/validation/checks.py)
    - missing_leads               # Lead entirely NaN or zero
    - nan_values                  # Any NaN in signal
    - truncated_signal            # Fewer samples than expected
    - flat_line                   # Lead with near-zero variance
    - corrupt_header              # Unreadable WFDB/EDF header
    - amplitude_outlier           # Samples outside physiological range
  amplitude_range_mv: [-10.0, 10.0]

# --- Labels [REQUIRED if the dataset has any] ---
# Exported fold CSVs are identification-only, so labels always come from the
# source dataset. This block says where. Declarative form covers a column select
# plus a join; anything needing a real derivation gets a module in
# ecgbench/labels/<slug>.py (see labels/ptbxl.py) which is dispatched by slug.
labels:
  source_csv: ""        # File holding the labels, relative to the dataset root.
  separator: ","
  join_column: ""       # Column in source_csv matching record_id_column above.
  columns: null         # List of columns to expose; null -> all except join_column.

# If the dataset genuinely ships no labels, say so instead — ECGDataset(labels=True)
# then raises LabelsUnavailableError quoting the reason, rather than returning
# empty columns. Always point at where labels COULD be obtained.
# labels:
#   available: false
#   unavailable_reason: >
#     This subset ships identifiers only. Diagnoses are in the full release: <url>

# --- Croissant Metadata ---
croissant:
  keywords: ["ECG", "electrocardiography"]
  rai_data_collection: ""
  rai_data_biases: ""
  rai_personal_sensitive_info: ""
